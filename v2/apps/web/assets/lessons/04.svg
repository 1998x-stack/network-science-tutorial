<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">ER随机图连边概率</title><desc id="desc">三个相同规模的节点集合分别以低、中、高概率独立连边，边数量逐步增加。</desc><rect width="760" height="300" rx="18" fill="#102238"/><g stroke="#70dbc3" stroke-width="2.5" fill="none"><path d="M90 90 L170 55 M90 90 L130 175 M170 55 L215 145 M330 90 L410 55 M330 90 L370 175 M410 55 L455 145 M330 90 L455 145 M370 175 L410 55 M570 90 L650 55 M570 90 L610 175 M650 55 L695 145 M570 90 L695 145 M610 175 L650 55 M570 90 L650 55 M610 175 L695 145 M570 90 L610 175 M650 55 L610 175"/></g><g fill="#f4bc7c" stroke="#fff" stroke-width="2"><circle cx="90" cy="90" r="11"/><circle cx="170" cy="55" r="11"/><circle cx="130" cy="175" r="11"/><circle cx="215" cy="145" r="11"/><circle cx="330" cy="90" r="11"/><circle cx="410" cy="55" r="11"/><circle cx="370" cy="175" r="11"/><circle cx="455" cy="145" r="11"/><circle cx="570" cy="90" r="11"/><circle cx="650" cy="55" r="11"/><circle cx="610" cy="175" r="11"/><circle cx="695" cy="145" r="11"/></g><g fill="#eaf3ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><text x="150" y="240">低 p · 稀疏</text><text x="390" y="240">中等 p</text><text x="630" y="240">高 p · 稠密</text></g><text x="380" y="278" fill="#9fb4ce" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">示意图仅表达概率变化；实际网络由独立伯努利试验生成</text></svg>
