<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-15-title diagram-15-desc"><title id="diagram-15-title">删一个点：星形和路径的碎片化不同</title><desc id="diagram-15-desc">两个七节点六边的图：星形中心被删除后六个孤立点，最大分量1；七节点路径中心被删除后两个三节点分量，最大分量3。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 15 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">删一个点：星形和路径的碎片化不同</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  公平比较</text><text x="749" y="190" font-size="19" fill="#eff8ff" >两种网络均 n=7、m=6</text><text x="749" y="216" font-size="19" fill="#bdd2df" >同样删除 1 个节点</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  星形中心</text><text x="749" y="295" font-size="19" fill="#eff8ff" >移除后剩 6 个孤立点</text><text x="749" y="321" font-size="19" fill="#bdd2df" >最大分量 = 1</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  路径中心</text><text x="749" y="400" font-size="19" fill="#eff8ff" >移除后 3 + 3 两分量</text><text x="749" y="426" font-size="19" fill="#bdd2df" >最大分量 = 3</text>
