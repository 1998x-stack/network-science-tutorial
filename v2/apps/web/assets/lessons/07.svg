ht="750">4</text><text x="515" y="68" font-size="13" fill="#eaf3ff" text-anchor="middle">k=1</text><circle cx="490" cy="205" r="22" fill="#f4bc7c" stroke="#fff" stroke-width="2"/><text x="490" y="210" font-size="15" fill="#132235" text-anchor="middle" font-weight="750">5</text><text x="490" y="173" font-size="13" fill="#eaf3ff" text-anchor="middle">k=1</text><circle cx="620" cy="260" r="22" fill="#465b73" stroke="#fff" stroke-width="2"/><text x="620" y="265" font-size="15" fill="#fff" text-anchor="middle" font-weight="750">6</text><text x="620" y="228" font-size="13" fill="#eaf3ff" text-anchor="middle">k=0</text><circle cx="690" cy="78" r="22" fill="#465b73" stroke="#fff" stroke-width="2"/><text x="690" y="83" font-size="15" fill="#fff" text-anchor="middle" font-weight="750">7</text><text x="690" y="46" font-size="13" fill="#eaf3ff" text-anchor="middle">k=0</text><text x="380" y="319" fill="#bdd0e7" text-anchor="middle" font-size="13">8 个节点 / 7 条边 / 两个孤立点 / 平均度 1.75</text></svg>
