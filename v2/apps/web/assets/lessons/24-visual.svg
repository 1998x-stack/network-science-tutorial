<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-24-title diagram-24-desc"><title id="diagram-24-title">真实静态数据，与人工投影实验分开</title><desc id="diagram-24-desc">Karate Club公开静态图具有34节点78边，不擅自绘制伪造的完整边；另一独立合成例子四个作者共一篇论文，投影成6对合著关系。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 24 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">真实静态数据，与人工投影实验分开</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  公开事实</text><text x="749" y="190" font-size="19" fill="#eff8ff" >Karate Club 34 个节点</text><text x="749" y="216" font-size="19" fill="#bdd2df" >78 条无向边</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  教学投影</text><text x="749" y="295" font-size="19" fill="#eff8ff" >1 篇论文有 4 名作者</text><text x="749" y="321" font-size="19" fill="#bdd2df" >产生 C(4,2)=6 对关系</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  边界</text><text x="749" y="400" font-size="19" fill="#eff8ff" >公开静态图≠未来预测</text><text x="749" y="426" font-size="19" fill="#bdd2df" >人工例子≠历史原图</text>
<rect x="76" y="183" width="205" height="226" rx="19" fill="#153b4e" stroke="#598e9d" stroke-width="2"/>
<text x="178" y="245" font-size="47" fill="#74dfc9" text-anchor="middle" font-weight="760">34</text><text x="178" y="276" font-size="19" fill="#bdd2df" text-anchor="middle">节点</text>
<text x="178" y="339" font-size="44" fill="#ffcc87" text-anchor="middle" font-weight="760">78</text><text x="178" y="371" font-size="18" fill="#bdd2df" text-anchor="middle">历史关系边</text>
<text x="480" y="192" font-size="19" fill="#ffcc87" text-anchor="middle">另一个合成投影</text>
