<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="f28b-title f28b-desc"><title id="f28b-title">六条事件的时间轴</title><desc id="f28b-desc">AB AC 时间1，BC CD 时间2，DE 时间3训练；BD时间5测试。</desc><rect x="1" y="1" width="958" height="378" rx="22" fill="#11293e" stroke="#467389"/><g font-family="system-ui,'PingFang SC',sans-serif"><path d="M70 193 H892" stroke="#7ebec0" stroke-width="5" fill="none"/><path d="M150 181 V209" stroke="#a6dede" stroke-width="4"/><text x="150" y="151" text-anchor="middle" fill="#e7f4f5" font-size="23">t=1</text><rect x="70" y="232" width="160" height="86" rx="15" fill="#20576b" stroke="#98d3ca"/><text x="150" y="270" fill="#fff" font-size="21" text-anchor="middle">AB / AC</text><text x="150" y="300" fill="#e6eff1" font-size="18" text-anchor="middle">训练</text><path d="M362 181 V209" stroke="#a6dede" stroke-width="4"/><text x="362" y="151" text-anchor="middle" fill="#e7f4f5" font-size="23">t=2</text><rect x="282" y="232" width="160" height="86" rx="15" fill="#20576b" stroke="#98d3ca"/><text x="362" y="270" fill="#fff" font-size="21" text-anchor="middle">BC / CD</text><text x="362" y="300" fill="#e6eff1" font-size="18" text-anchor="middle">训练</text><path d="M570 181 V209" stroke="#a6dede" stroke-width="4"/><text x="570" y="151" text-anchor="middle" fill="#e7f4f5" font-size="23">t=3</text><rect x="490" y="232" width="160" height="86" rx="15" fill="#20576b" stroke="#98d3ca"/><text x="570" y="270" fill="#fff" font-size="21" text-anchor="middle">DE</text><text x="570" y="300" fill="#e6eff1" font-size="18" text-anchor="middle">训练</text><path d="M804 181 V209" stroke="#a6dede" stroke-width="4"/><text x="804" y="151" text-anchor="middle" fill="#e7f4f5" font-size="23">t=5</text><rect x="724" y="232" width="160" height="86" rx="15" fill="#805338" stroke="#98d3ca"/><text x="804" y="270" fill="#fff" font-size="21" text-anchor="middle">BD</text><text x="804" y="300" fill="#e6eff1" font-size="18" text-anchor="middle">测试</text><text x="480" y="59" text-anchor="middle" fill="#a2f0dc" font-size="22">先切分原始事件，再构造训练图和测试候选</text><text x="480" y="356" text-anchor="middle" fill="#c3e1e8" font-size="16">事件时间，而非文件行顺序，决定可见性。</text></g></svg>
