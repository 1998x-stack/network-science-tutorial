<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-08-title diagram-08-desc"><title id="diagram-08-title">连接多 ≠ 承担跨群体路径</title><desc id="diagram-08-desc">两个三角形由桥C-D相连，C和D的度均为3，去掉桥边后网络会分成两个分量。度数与介数反映不同研究目标。</desc><defs><marker id="arr-08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ecaff"/></marker></defs><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 08 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">连接多 ≠ 承担跨群体路径</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  直接连接</text><text x="749" y="190" font-size="19" fill="#eff8ff" >C 与 D 度数均为 3</text><text x="749" y="216" font-size="19" fill="#bdd2df" >其余顶点度数为 2</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  桥梁作用</text><text x="749" y="295" font-size="19" fill="#eff8ff" >C—D 是跨群体唯一边</text><text x="749" y="321" font-size="19" fill="#bdd2df" >很多最短路径要经过它</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  反事实</text><text x="749" y="400" font-size="19" fill="#eff8ff" >移除桥 C—D 后</text><text x="749" y="426" font-size="19" fill="#bdd2df" >连通分量从 1 变 2</text>
<path d="M 111 210 L 218 180" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 218 180 L 218 335" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 218 335 L 111 210" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 478 180 L 588 210" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 588 210 L 478 335" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 478 335 L 478 180" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" />
<path d="M 218 335 L 478 335" fill="none" stroke="#ffcc87" stroke-width="6" stroke-linecap="round" stroke-dasharray="11 8"/>
<circle cx="111" cy="210" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="111" y="217" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="218" cy="180" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="218" y="187" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="218" cy="335" r="29" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="218" y="342" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="478" cy="335" r="29" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="478" y="342" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><circle cx="478" cy="180" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="478" y="187" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">E</text><circle cx="588" cy="210" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="588" y="217" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">F</text>
<text x="349" y="304" font-size="19" fill="#ffcc87" text-anchor="middle">唯一跨组桥</text><text x="349" y="409" font-size="18" fill="#bdd2df" text-anchor="middle">桥的结构作用 ≠ 一定有最大实际流量</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：观测结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >仅用于定义和机制核对</text></svg>
