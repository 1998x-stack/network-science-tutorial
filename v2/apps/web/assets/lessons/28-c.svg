<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="f28c-title f28c-desc"><title id="f28c-title">可复现科研的六个质量门禁</title><desc id="f28c-desc">输入事件、建图语义、时间切分、结构指标、候选评估、报告和测试形成端到端闭环。</desc><rect x="1" y="1" width="958" height="378" rx="22" fill="#11293e" stroke="#467389"/><g font-family="system-ui,'PingFang SC',sans-serif"><rect x="20" y="50" width="291" height="111" rx="16" fill="#1b465d" stroke="#68b7ad"/><text x="165" y="94" fill="#abf4dc" text-anchor="middle" font-size="21">原始事件</text><text x="165" y="131" fill="#e1edf3" text-anchor="middle" font-size="17">ID、时间、许可</text><rect x="333" y="50" width="291" height="111" rx="16" fill="#1b465d" stroke="#68b7ad"/><text x="478" y="94" fill="#abf4dc" text-anchor="middle" font-size="21">建图契约</text><text x="478" y="131" fill="#e1edf3" text-anchor="middle" font-size="17">无向、去重、自环</text><rect x="646" y="50" width="291" height="111" rx="16" fill="#1b465d" stroke="#68b7ad"/><text x="791" y="94" fill="#abf4dc" text-anchor="middle" font-size="21">时间切分</text><text x="791" y="131" fill="#e1edf3" text-anchor="middle" font-size="17">训练图不含 BD@5</text><rect x="20" y="203" width="291" height="111" rx="16" fill="#1b465d" stroke="#68b7ad"/><text x="165" y="247" fill="#abf4dc" text-anchor="middle" font-size="21">结构评分</text><text x="165" y="284" fill="#e1edf3" text-anchor="middle" font-size="17">CN 与独立 oracle</text><rect x="333" y="203" width="291" height="111" rx="16" fill="#1b465d" stroke="#68b7ad"/><text x="478" y="247" fill="#abf4dc" text-anchor="middle" font-size="21">候选评价</text><text x="478" y="284" fill="#e1edf3" text-anchor="middle" font-size="17">分母、时间窗</text><rect x="646" y="203" width="291" height="111" rx="16" fill="#1b465d" stroke="#68b7ad"/><text x="791" y="247" fill="#abf4dc" text-anchor="middle" font-size="21">归档与复核</text><text x="791" y="284" fill="#e1edf3" text-anchor="middle" font-size="17">JSON、版本、风险</text><text x="480" y="361" text-anchor="middle" fill="#bddee5" font-size="16">某一步失败就拒绝宣称可复现，报告里区分已验证和未验证。</text></g></svg>
