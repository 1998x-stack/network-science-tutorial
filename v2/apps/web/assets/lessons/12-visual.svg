<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-12-title diagram-12-desc"><title id="diagram-12-title">SIR：同一条路径上的三张时点快照</title><desc id="diagram-12-desc">A-B-C-D-E五节点接触链，beta等于1，感染一个时间步后康复。t0只有A为I，t2只有C为I，t4只有E为I。</desc><defs><marker id="arr-12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ecaff"/></marker></defs><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 12 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">SIR：同一条路径上的三张时点快照</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  假设</text><text x="749" y="190" font-size="19" fill="#eff8ff" >路径 A—B—C—D—E</text><text x="749" y="216" font-size="19" fill="#bdd2df" >β=1、同步更新</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  时间 t=2</text><text x="749" y="295" font-size="19" fill="#eff8ff" >A、B 已恢复为 R</text><text x="749" y="321" font-size="19" fill="#bdd2df" >当前感染者是 C</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  时间 t=4</text><text x="749" y="400" font-size="19" fill="#eff8ff" >A…D 都为 R，E 为 I</text><text x="749" y="426" font-size="19" fill="#bdd2df" >并非真实流行率预测</text>
<text x="79" y="211" font-size="21" fill="#ffcc87" >t = 0</text><path d="M 222 202 L 277 202" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="200" cy="202" r="24" fill="#ff9b90" stroke="#0c2733" stroke-width="3"/><text x="200" y="209" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><text x="200" y="250" font-size="16" fill="#ff9b90" text-anchor="middle">I</text><path d="M 321 202 L 376 202" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="299" cy="202" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="299" y="209" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><text x="299" y="250" font-size="16" fill="#74dfc9" text-anchor="middle">S</text><path d="M 420 202 L 475 202" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="398" cy="202" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="398" y="209" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><text x="398" y="250" font-size="16" fill="#74dfc9" text-anchor="middle">S</text><path d="M 519 202 L 574 202" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="497" cy="202" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="497" y="209" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><text x="497" y="250" font-size="16" fill="#74dfc9" text-anchor="middle">S</text><circle cx="596" cy="202" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="596" y="209" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">E</text><text x="596" y="250" font-size="16" fill="#74dfc9" text-anchor="middle">S</text><text x="79" y="308" font-size="21" fill="#ffcc87" >t = 2</text><path d="M 222 299 L 277 299" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="200" cy="299" r="24" fill="#8da9ba" stroke="#0c2733" stroke-width="3"/><text x="200" y="306" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><text x="200" y="347" font-size="16" fill="#8da9ba" text-anchor="middle">R</text><path d="M 321 299 L 376 299" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="299" cy="299" r="24" fill="#8da9ba" stroke="#0c2733" stroke-width="3"/><text x="299" y="306" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><text x="299" y="347" font-size="16" fill="#8da9ba" text-anchor="middle">R</text><path d="M 420 299 L 475 299" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="398" cy="299" r="24" fill="#ff9b90" stroke="#0c2733" stroke-width="3"/><text x="398" y="306" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><text x="398" y="347" font-size="16" fill="#ff9b90" text-anchor="middle">I</text><path d="M 519 299 L 574 299" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="497" cy="299" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="497" y="306" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><text x="497" y="347" font-size="16" fill="#74dfc9" text-anchor="middle">S</text><circle cx="596" cy="299" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="596" y="306" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">E</text><text x="596" y="347" font-size="16" fill="#74dfc9" text-anchor="middle">S</text><text x="79" y="405" font-size="21" fill="#ffcc87" >t = 4</text><path d="M 222 396 L 277 396" fill="none" stroke="#2f5268" stroke-width="5" stroke-linecap="round" /><circle cx="200" cy="396" r="24" fill="#8da9ba" stroke="#0c2733" stroke-width="3"/><text x="200" y="403" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><text x="200" y="444" font-size="16" fill="#8da9ba" text-anchor="middle">R</text><path 