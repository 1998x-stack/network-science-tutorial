<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">图与邻接表示</title><desc id="desc">左侧是四个顶点的无向图，右侧是同一图的邻接矩阵。</desc><rect width="760" height="330" rx="18" fill="#102238"/><g stroke="#70dbc3" stroke-width="4" fill="none"><path d="M100 95 L260 95 L180 235 Z M260 95 L390 235"/></g><g fill="#f4bc7c" stroke="#fff" stroke-width="3"><circle cx="100" cy="95" r="22"/><circle cx="260" cy="95" r="22"/><circle cx="180" cy="235" r="22"/><circle cx="390" cy="235" r="22"/></g><g fill="#eaf3ff" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="100" y="101">A</text><text x="260" y="101">B</text><text x="180" y="241">C</text><text x="390" y="241">D</text><text x="245" y="40" font-size="16">同一张图的三种存储形式</text></g><g fill="#9fb4ce" font-family="ui-monospace,monospace" font-size="17"><text x="470" y="90">A  0 1 1 0</text><text x="470" y="124">B  1 0 1 0</text><text x="470" y="158">C  1 1 0 1</text><text x="470" y="192">D  0 0 1 0</text><text x="470" y="242" font-size="13">矩阵对称 ⇔ 无向边</text></g></svg>
