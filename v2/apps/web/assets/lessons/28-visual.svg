<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-28-title diagram-28-desc"><title id="diagram-28-title">可重复项目：预测边不得进入训练图</title><desc id="diagram-28-desc">合成事件在t1和t2有四条边，t3新增DE作为合法历史，t5新增BD仅作未来测试。对历史t≤3图，候选BD共同邻居1，BE共同邻居0。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 28 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">可重复项目：预测边不得进入训练图</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  原始事件</text><text x="749" y="190" font-size="19" fill="#eff8ff" >AB AC @1，BC CD @2</text><text x="749" y="216" font-size="19" fill="#bdd2df" >DE @3，BD @5</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  训练用图</text><text x="749" y="295" font-size="19" fill="#eff8ff" >截至 t=3 有 5 条边</text><text x="749" y="321" font-size="19" fill="#bdd2df" >未来 BD 不能加入</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  候选分数</text><text x="749" y="400" font-size="19" fill="#eff8ff" >CN(B,D)=1；CN(B,E)=0</text><text x="749" y="426" font-size="19" fill="#bdd2df" >Precision@1 限两条候选</text>
<path d="M102 269 L644 269" stroke="#8da9ba" stroke-width="5" fill="none" stroke-linecap="round" />
<path d="M153 260 L153 280" stroke="#eff8ff" stroke-width="3" fill="none" stroke-linecap="round" /><text x="153" y="232" font-size="19" fill="#74dfc9" text-anchor="middle">t=1</text><rect x="93" y="299" width="120" height="75" rx="10" fill="#214a55" stroke="#8ecaff" stroke-width="2"/><text x="153" y="330" font-size="20" fill="#eff8ff" text-anchor="middle">AB/AC</text><text x="153" y="355" font-size="16" fill="#bdd2df" text-anchor="middle">已观察</text><path d="M285 260 L285 280" stroke="#eff8ff" stroke-width="3" fill="none" stroke-linecap="round" /><text x="285" y="232" font-size="19" fill="#74dfc9" text-anchor="middle">t=2</text><rect x="225" y="299" width="120" height="75" rx="10" fill="#214a55" stroke="#8ecaff" stroke-width="2"/><text x="285" y="330" font-size="20" fill="#eff8ff" text-anchor="middle">BC/CD</text><text x="285" y="355" font-size="16" fill="#bdd2df" text-anchor="middle">已观察</text><path d="M422 260 L422 280" stroke="#eff8ff" stroke-width="3" fill="none" stroke-linecap="round" /><text x="422" y="232" font-size="19" fill="#74dfc9" text-anchor="middle">t=3</text><rect x="362" y="299" width="120" height="75" rx="10" fill="#214a55" stroke="#8ecaff" stroke-width="2"/><text x="422" y="330" font-size="20" fill="#eff8ff" text-anchor="middle">DE</text><text x="422" y="355" font-size="16" fill="#bdd2df" text-anchor="middle">已观察</text><path d="M570 260 L570 280" stroke="#eff8ff" stroke-width="3" fill="none" stroke-linecap="round" /><text x="570" y="232" font-size="19" fill="#ff9b90" text-anchor="middle">t=5</text><rect x="510" y="299" width="120" height="75" rx="10" fill="#6f3e3e" stroke="#ff9b90" stroke-width="2"/><text x="570" y="330" font-size="20" fill="#eff8ff" text-anchor="middle">BD</text><text x="570" y="355" font-size="16" fill="#bdd2df" text-anchor="middle">未来测试</text>
<text x="350" y="417" font-size="19" fill="#ffcc87" text-anchor="middle">训练特征 ← t≤3    |    标签 ← t=5</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观测输入或结构</text><text x="270" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或边界</text><text x="755" y="483" font-size="16" fill="#bdd2df" >本页均明确区分事实与示例</text></svg>
