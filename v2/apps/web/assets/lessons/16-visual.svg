<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-16-title diagram-16-desc"><title id="diagram-16-title">链路预测：未来边不能进入训练图</title><desc id="diagram-16-desc">五节点六边无向图的已知边是AB AC BC BD CD DE，候选A-D缺失，邻居交集是B C所以共同邻居2且Jaccard为2/3。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 16 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">链路预测：未来边不能进入训练图</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  已知结构</text><text x="749" y="190" font-size="19" fill="#eff8ff" >训练图 5 节点、6 条边</text><text x="749" y="216" font-size="19" fill="#bdd2df" >候选 A—D 仍未连接</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  局部评分</text><text x="749" y="295" font-size="19" fill="#eff8ff" >N(A)={B,C}</text><text x="749" y="321" font-size="19" fill="#bdd2df" >N(D)={B,C,E}</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  核算与防漏</text><text x="749" y="400" font-size="19" fill="#eff8ff" >CN(A,D)=2</text><text x="749" y="426" font-size="19" fill="#bdd2df" >Jaccard(A,D)=2/3</text>
<path d="M130 246 L275 182" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M130 246 L275 341" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M275 182 L275 341" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M275 182 L452 247" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M275 341 L452 247" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M452 247 L588 247" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" />
<path d="M130 246 L452 247" stroke="#ffcc87" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="12 9"/>
<circle cx="130" cy="246" r="28" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="130" y="253" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="275" cy="182" r="28" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="275" y="189" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="275" cy="341" r="28" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="275" y="348" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="452" cy="247" r="28" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="452" y="254" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><circle cx="588" cy="247" r="28" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="588" y="254" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">E</text>
<text x="285" y="239" font-size="19" fill="#ffcc87" text-anchor="middle">虚线 = 预测候选</text>
<text x="353" y="419" font-size="19" fill="#bdd2df" text-anchor="middle">B、C 是 A 和 D 的共同邻居</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：历史/可见状态</text><text x="275" y="483" font-size="16" fill="#ffcc87" >琥珀：关键边界或变化</text><text x="755" y="483" font-size="16" fill="#bdd2df" >示意值不代表真实预测</text></svg>
