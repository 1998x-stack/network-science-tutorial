<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-18-title diagram-18-desc"><title id="diagram-18-title">六条事件 → 四条无向边（规则驱动）</title><desc id="diagram-18-desc">原始事件AB BA BC CC CD DE六行；将AB与BA合并为同一无向关系，排除CC自环，最终AB BC CD DE四条边。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 18 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">六条事件 → 四条无向边（规则驱动）</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  原始数据</text><text x="749" y="190" font-size="19" fill="#eff8ff" >6 行有向事件记录</text><text x="749" y="216" font-size="19" fill="#bdd2df" >同向与反向都保留</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  投影规则</text><text x="749" y="295" font-size="19" fill="#eff8ff" >A→B / B→A 合并</text><text x="749" y="321" font-size="19" fill="#bdd2df" >C→C 自环排除</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  最终结果</text><text x="749" y="400" font-size="19" fill="#eff8ff" >A—B—C—D—E</text><text x="749" y="426" font-size="19" fill="#bdd2df" >5 个节点、4 条无向边</text>
<rect x="75" y="185" width="232" height="226" rx="15" fill="#143247" stroke="#2f5268" stroke-width="2"/><text x="188" y="220" font-size="21" fill="#74dfc9" text-anchor="middle">原始 6 行</text>
<text x="188" y="251" font-size="19" fill="#eff8ff" text-anchor="middle">A→B</text><text x="188" y="277" font-size="19" fill="#ff9b90" text-anchor="middle">B→A</text><text x="188" y="303" font-size="19" fill="#eff8ff" text-anchor="middle">B→C</text><text x="188" y="329" font-size="19" fill="#ff9b90" text-anchor="middle">C→C</text><text x="188" y="355" font-size="19" fill="#eff8ff" text-anchor="middle">C→D</text><text x="188" y="381" font-size="19" fill="#eff8ff" text-anchor="middle">D→E</text>
<path d="M316 290 L389 290" stroke="#ffcc87" stroke-width="6" fill="none" stroke-linecap="round" /><text x="352" y="272" font-size="20" fill="#ffcc87" text-anchor="middle">规则</text>
<path d="M427 296 L491 296" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M491 296 L555 296" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M555 296 L619 296" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M619 296 L683 296" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" />
<circle cx="427" cy="296" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="427" y="303" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="491" cy="296" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="491" y="303" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="555" cy="296" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="555" y="303" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="619" cy="296" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="619" y="303" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><circle cx="683" cy="296" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="683" y="303" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">E</text>
<text x="552" y="370" font-size="20" fill="#ffcc87" text-anchor="middle">4 条最终无向边</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：历史/可见状态</text><text x="275" y="483" font-size="16" fill="#ffcc87" >琥珀：关键边界或变化</text><text x="755" y="483" font-size="16" fill="#bdd2df" >示意值不代表真实预测</text></svg>
