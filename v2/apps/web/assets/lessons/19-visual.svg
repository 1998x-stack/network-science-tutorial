<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-19-title diagram-19-desc"><title id="diagram-19-title">实体相同，关系层不同</title><desc id="diagram-19-desc">社会层A-B与B-C相连，合作层A-C与C-D相连，相同实体在两层有节点副本；虚线连接同一实体的两个层状态，并不是新的社会关系。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 19 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">实体相同，关系层不同</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  实体集</text><text x="749" y="190" font-size="19" fill="#eff8ff" >A、B、C、D 在两层复用</text><text x="749" y="216" font-size="19" fill="#bdd2df" >(节点, 层) 才是状态</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  两种边</text><text x="749" y="295" font-size="19" fill="#eff8ff" >社交：AB、BC</text><text x="749" y="321" font-size="19" fill="#bdd2df" >合作：AC、CD</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  跨层路径</text><text x="749" y="400" font-size="19" fill="#eff8ff" >同一实体的层间耦合</text><text x="749" y="426" font-size="19" fill="#bdd2df" >不等于增加了社交边</text>
<text x="78" y="200" font-size="21" fill="#74dfc9" >社交层</text><text x="78" y="359" font-size="21" fill="#ffcc87" >合作层</text>
<path d="M220 222 L344 222" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M344 222 L468 222" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><circle cx="220" cy="222" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="220" y="229" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="344" cy="222" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="344" y="229" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="468" cy="222" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="468" y="229" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="592" cy="222" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="592" y="229" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><path d="M220 352 L468 352" stroke="#ffcc87" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M468 352 L592 352" stroke="#ffcc87" stroke-width="5" fill="none" stroke-linecap="round" /><circle cx="220" cy="352" r="21" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="220" y="359" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="344" cy="352" r="21" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="344" y="359" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="468" cy="352" r="21" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="468" y="359" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="592" cy="352" r="21" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="592" y="359" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">D</text>
<path d="M220 248 L220 326" stroke="#8da9ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M344 248 L344 326" stroke="#8da9ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M468 248 L468 326" stroke="#8da9ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M592 248 L592 326" stroke="#8da9ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="391" y="427" font-size="18" fill="#bdd2df" text-anchor="middle">同一实体上下连线 = 换层成本</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：历史/可见状态</text><text x="275" y="483" font-size="16" fill="#ffcc87" >琥珀：关键边界或变化</text><text x="755" y="483" font-size="16" fill="#bdd2df" >示意值不代表真实预测</text></svg>
