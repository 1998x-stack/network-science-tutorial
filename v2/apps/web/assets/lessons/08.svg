<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">两组之间的路径桥梁</title><desc id="desc">左、右各一组三角形，连接这两组的唯一跨组边是 C 到 D，节点 C 和 D 被突出标记。</desc><rect width="760" height="340" rx="18" fill="#102238"/><line x1="135" y1="85" x2="135" y2="235" stroke="#577b96" stroke-width="4"/><line x1="135" y1="85" x2="290" y2="160" stroke="#577b96" stroke-width="4"/><line x1="135" y1="235" x2="290" y2="160" stroke="#577b96" stroke-width="4"/><line x1="290" y1="160" x2="470" y2="160" stroke="#f4bc7c" stroke-width="6"/><line x1="470" y1="160" x2="625" y2="85" stroke="#577b96" stroke-width="4"/><line x1="470" y1="160" x2="625" y2="235" stroke="#577b96" stroke-width="4"/><line x1="625" y1="85" x2="625" y2="235" stroke="#577b96" stroke-width="4"/><circle cx="135" cy="85" r="23" fill="#70dbc3" stroke="#fff" stroke-width="2"/><text x="135" y="91" fill="#0a2035" text-anchor="middle" font-weight="800" font-size="18">A</text><circle cx="135" cy="235" r="23" fill="#70dbc3" stroke="#fff" stroke-width="2"/><text x="135" y="241" fill="#0a2035" text-anchor="middle" font-weight="800" font-size="18">B</text><circle cx="290" cy="160" r="29" fill="#f4bc7c" stroke="#fff" stroke-width="2"/><text x="290" y="166" fill="#0a2035" text-anchor="middle" font-weight="800" font-size="18">C</text><circle cx="470" cy="160" r="29" fill="#f4bc7c" stroke="#fff" stroke-width="2"/><text x="470" y="166" fill="#0a2035" text-anchor="middle" font-weight="800" font-size="18">D</text><circle cx="625" cy="85" r="23" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="625" y="91" fill="#0a2035" text-anchor="middle" font-weight="800" font-size="18">E</text><circle cx="625" cy="235" r="23" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="625" y="241" fill="#0a2035" text-anchor="middle" font-weight="800" font-size="18">F</text><text x="380" y="72" text-anchor="middle" fill="#f4bc7c" font-size="15" font-weight="700">唯一跨社团的桥 C—D</text><text x="380" y="305" fill="