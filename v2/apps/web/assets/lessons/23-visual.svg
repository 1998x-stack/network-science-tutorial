<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-23-title diagram-23-desc"><title id="diagram-23-title">先核对图，再调用 NetworkX</title><desc id="diagram-23-desc">两个三角形A B C和D E F由桥C D相连，节点G孤立；七节点七边，原来连通分量2个，删除桥后变成3个分量。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 23 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">先核对图，再调用 NetworkX</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  节点全集</text><text x="749" y="190" font-size="19" fill="#eff8ff" >A…G 共 7 个节点</text><text x="749" y="216" font-size="19" fill="#bdd2df" >G 是合法孤立点</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  原始图</text><text x="749" y="295" font-size="19" fill="#eff8ff" >两个三角形 + C—D</text><text x="749" y="321" font-size="19" fill="#bdd2df" >m=7，连通分量 2</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  删除桥</text><text x="749" y="400" font-size="19" fill="#eff8ff" >仅删除 C—D</text><text x="749" y="426" font-size="19" fill="#bdd2df" >分量从 2 变成 3</text>
<path d="M123 227 L243 227" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M243 227 L188 359" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M123 227 L188 359" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M446 227 L592 227" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M592 227 L520 359" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M446 227 L520 359" stroke="#8ecaff" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M188 359 L446 227" stroke="#ffcc87" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="10 7"/>
<circle cx="123" cy="227" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="123" y="234" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="243" cy="227" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="243" y="234" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="188" cy="359" r="24" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="188" y="366" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="446" cy="227" r="24" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="446" y="234" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><circle cx="592" cy="227" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="592" y="234" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">E</text><circle cx="520" cy="359" r="24" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="520" y="366" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">F</text><circle cx="638" cy="391" r="24" fill="#ff9b90" stroke="#0c2733" stroke-width="3"/><text x="638" y="398" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">G</text>
