<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="n21a-title n21a-desc"><title id="n21a-title">node2vec 在边 A–B 后的条件转移</title><desc id="n21a-desc">图中 A、B、C 组成三角形，D 只连接 B。已经走过 A 到 B 时，下一步 B 到 A 权重一除以 p，B 到 C 权重一，B 到 D 权重一除以 q；归一化后成为概率。</desc><rect x="1" y="1" width="918" height="368" rx="22" fill="#10283b" stroke="#34556e"/><g font-family="system-ui,'PingFang SC',sans-serif">
    <g fill="none" stroke="#82b0bc" stroke-width="6" stroke-linecap="round"><path d="M150 100 L380 175 L160 285 Z"/><path d="M380 175 L635 170"/></g>
    <g stroke="#d6e9ef" stroke-width="3"><circle cx="150" cy="100" r="36" fill="#1d7887"/><circle cx="380" cy="175" r="38" fill="#a26734"/><circle cx="160" cy="285" r="36" fill="#267f73"/><circle cx="635" cy="170" r="38" fill="#5d568e"/></g>
    <g fill="#f3fbff" font-size="26" font-weight="700" text-anchor="middle"><text x="150" y="109">A</text><text x="380" y="184">B</text><text x="160" y="294">C</text><text x="635" y="179">D</text></g>
    <g fill="#d3e7ee" font-size="18"><text x="215" y="85">返回 A：1/p</text><text x="243" y="265">邻接 A 的 C：1</text><text x="480" y="135">向外到 D：1/q</text></g>
    <text x="680" y="252" fill="#a2e7d8" font-size="18">前一节点 t=A</text><text x="680" y="285" fill="#a2e7d8" font-size="18">当前节点 v=B</text><text x="462" y="335" text-anchor="middle" fill="#dbe8ed" font-size="15">本图全部边是教学玩具结构；p、q 不指定唯一的 BFS/DFS 路径。</text></g></svg>
