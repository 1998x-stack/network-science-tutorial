<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="f27c-title f27c-desc"><title id="f27c-title">社会混杂的合成因果图</title><desc id="f27c-desc">Z同时作用于X曝光和Y采纳，X到Y没有真实直接效应。</desc><rect x="1" y="1" width="958" height="378" rx="22" fill="#11293e" stroke="#467389"/><g font-family="system-ui,'PingFang SC',sans-serif"><path d="M475 105 L250 268" fill="none" stroke="#87c3c9" stroke-width="5" /><path d="M475 105 L710 268" fill="none" stroke="#87c3c9" stroke-width="5" /><path d="M288 268 L665 268" fill="none" stroke-width="5" stroke="#d89883" stroke-dasharray="10 8"/><circle cx="475" cy="105" r="34" fill="#a4743d" stroke="#d1e6e8" stroke-width="2.5"/><text x="475" y="113" text-anchor="middle" fill="white" font-size="24">Z</text><circle cx="250" cy="268" r="34" fill="#2c7183" stroke="#d1e6e8" stroke-width="2.5"/><text x="250" y="276" text-anchor="middle" fill="white" font-size="24">X</text><circle cx="710" cy="268" r="34" fill="#2c7183" stroke="#d1e6e8" stroke-width="2.5"/><text x="710" y="276" text-anchor="middle" fill="white" font-size="24">Y</text><text x="475" y="47" text-anchor="middle" fill="#a6ecdb" font-size="22">Z：共同原因</text><text x="250" y="341" text-anchor="middle" fill="#d4eaf1" font-size="20">X：曝光</text><text x="710" y="341" text-anchor="middle" fill="#d4eaf1" font-size="20">Y：采纳</text><text x="475" y="246" text-anchor="middle" fill="#f2b9a3" font-size="21">直接影响？</text><text x="475" y="372" text-anchor="middle" fill="#b4d2dc" font-size="14">虚线仅为需要检验的问题，本合成例子没有 X 到 Y 的直接因果边。</text></g></svg>
