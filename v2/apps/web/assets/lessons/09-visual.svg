<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-09-title diagram-09-desc"><title id="diagram-09-title">有向链接与悬挂节点如何改变 PageRank</title><desc id="diagram-09-desc">网页A指向B，B指向C，C指向B，D无出链；PageRank必须处理D的悬挂概率质量并采用明确的跳转分布。</desc><defs><marker id="arr-09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ecaff"/></marker></defs><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 09 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">有向链接与悬挂节点如何改变 PageRank</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  方向</text><text x="749" y="190" font-size="19" fill="#eff8ff" >A → B，B ↔ C</text><text x="749" y="216" font-size="19" fill="#bdd2df" >不是无向关系</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  悬挂节点</text><text x="749" y="295" font-size="19" fill="#eff8ff" >D 出度为 0</text><text x="749" y="321" font-size="19" fill="#bdd2df" >不得让概率质量消失</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  随机跳转</text><text x="749" y="400" font-size="19" fill="#eff8ff" >用统一转移规则和 α</text><text x="749" y="426" font-size="19" fill="#bdd2df" >维持总概率质量为 1</text>
<path d="M 130 263 L 275 220" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 295 230 L 482 260" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 482 292 L 292 260" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" />
<text x="188" y="230" font-size="31" fill="#ffcc87" >→</text><text x="397" y="234" font-size="30" fill="#ffcc87" >→</text><text x="394" y="307" font-size="30" fill="#ffcc87" >←</text>
<circle cx="112" cy="265" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="112" y="272" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="280" cy="242" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="280" y="249" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="488" cy="271" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="488" y="278" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="598" cy="360" r="29" fill="#ff9b90" stroke="#0c2733" stroke-width="3"/><text x="598" y="367" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">D</text>
<text x="556" y="399" font-size="19" fill="#ff9b90" text-anchor="middle">无出链</text>
<rect x="155" y="356" width="285" height="61" rx="10" fill="#163c52" stroke="#3f6980" stroke-width="2"/><text x="297" y="395" font-size="21" fill="#eff8ff" text-anchor="middle">阻止悬挂质量丢失</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：观测结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >仅用于定义和机制核对</text></svg>
