<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 337" role="img" aria-labelledby="title desc"><title id="title">简单与复杂传播的六节点教学图</title><desc id="desc">A和B作为初始种子，A连接C，B连接C和D，C连接D和E，D连接E，E连接F。F只有E一个邻居，因此人数阈值2时永不采纳。</desc><rect width="760" height="337" rx="18" fill="#102238"/>
<line x1="96" y1="70" x2="285" y2="100" stroke="#668ba9" stroke-width="3.7"/><line x1="96" y1="247" x2="285" y2="100" stroke="#668ba9" stroke-width="3.7"/><line x1="96" y1="247" x2="285" y2="237" stroke="#668ba9" stroke-width="3.7"/><line x1="285" y1="100" x2="285" y2="237" stroke="#668ba9" stroke-width="3.7"/><line x1="285" y1="100" x2="508" y2="163" stroke="#668ba9" stroke-width="3.7"/><line x1="285" y1="237" x2="508" y2="163" stroke="#668ba9" stroke-width="3.7"/><line x1="508" y1="163" x2="667" y2="163" stroke="#668ba9" stroke-width="3.7"/>
<circle cx="96" cy="70" r="25" fill="#f4bc7c" stroke="#f2f8ff" stroke-width="2.1"/><text x="96" y="76" fill="#102338" text-anchor="middle" font-size="19" font-weight="800">A</text><text x="96" y="35" text-anchor="middle" fill="#f3f7ff" font-size="13">种子</text><circle cx="96" cy="247" r="25" fill="#f4bc7c" stroke="#f2f8ff" stroke-width="2.1"/><text x="96" y="253" fill="#102338" text-anchor="middle" font-size="19" font-weight="800">B</text><text x="96" y="212" text-anchor="middle" fill="#f3f7ff" font-size="13">种子</text><circle cx="285" cy="100" r="25" fill="#70dbc3" stroke="#f2f8ff" stroke-width="2.1"/><text x="285" y="106" fill="#102338" text-anchor="middle" font-size="19" font-weight="800">C</text><text x="285" y="65" text-anchor="middle" fill="#f3f7ff" font-size="13">第一轮</text><circle cx="285" cy="237" r="25" fill="#70dbc3" stroke="#f2f8ff" stroke-width="2.1"/><text x="285" y="243" fill="#102338" text-anchor="middle" font-size="19" font-weight="800">D</text><text x="285" y="202" text-anchor="middle" fill="#f3f7ff" font-size="13">第二轮</text><circle cx="508" cy="163" r="25" fill="#70dbc3" stroke="#f2f8ff" stroke-width="2.1"/><text x="508" y="169" fill="#102338" text-anchor="middle" font-size="19" font-weight="800">E</text><text x="508" y="128" text-anchor="middle" fill="#f3f7ff" font-size="13">第三轮</text><circle cx="667" cy="163" r="25" fill="#70dbc3" stroke="#f2f8ff" stroke-width="2.1"/><text x="667" y="169" fill="#102338" text-anchor="middle" font-size="19" font-weight="800">F</text><text x="667" y="128" text-anchor="middle" fill="#f3f7ff" font-size="13">m=2 停止</text>
<text x="380" y="319" fill="#c5d6e8" text-anchor="middle" font-size="14">无向接触边 · m=2 时 A、B → C → D → E；F 缺少第二位活跃邻居</text></svg>
