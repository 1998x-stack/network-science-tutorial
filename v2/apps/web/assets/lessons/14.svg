<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" role="img" aria-labelledby="title desc"><title id="title">四节点捐赠博弈与收益</title><desc id="desc">无向路径A-B-C-D。节点A、B合作，节点C、D背叛。每条合作边每个邻居获得b=3，合作方按每个邻居支付c=1。总收益A2 B1 C3 D0。</desc><rect width="760" height="326" rx="18" fill="#102238"/><line x1="118" y1="145" x2="622" y2="145" stroke="#6f8da6" stroke-width="4"/>
<g><circle cx="118" cy="145" r="35" fill="#70dbc3" stroke="#f5f8ff" stroke-width="2.3"/><text x="118" y="152" text-anchor="middle" fill="#0c2434" font-size="21" font-weight="800">A</text><text x="118" y="90" text-anchor="middle" fill="#e7f3ff" font-size="16">策略 C</text><text x="118" y="207" text-anchor="middle" fill="#f0f7ff" font-size="17">π=2</text></g><g><circle cx="286" cy="145" r="35" fill="#70dbc3" stroke="#f5f8ff" stroke-width="2.3"/><text x="286" y="152" text-anchor="middle" fill="#0c2434" font-size="21" font-weight="800">B</text><text x="286" y="90" text-anchor="middle" fill="#e7f3ff" font-size="16">策略 C</text><text x="286" y="207" text-anchor="middle" fill="#f0f7ff" font-size="17">π=1</text></g><g><circle cx="454" cy="145" r="35" fill="#f4bc7c" stroke="#f5f8ff" stroke-width="2.3"/><text x="454" y="152" text-anchor="middle" fill="#0c2434" font-size="21" font-weight="800">C</text><text x="454" y="90" text-anchor="middle" fill="#e7f3ff" font-size="16">策略 D</text><text x="454" y="207" text-anchor="middle" fill="#f0f7ff" font-size="17">π=3</text></g><g><circle cx="622" cy="145" r="35" fill="#f4bc7c" stroke="#f5f8ff" stroke-width="2.3"/><text x="622" y="152" text-anchor="middle" fill="#0c2434" font-size="21" font-weight="800">D</text><text x="622" y="90" text-anchor="middle" fill="#e7f3ff" font-size="16">策略 D</text><text x="622" y="207" text-anchor="middle" fill="#f0f7ff" font-size="17">π=0</text></g>
<g fill="#bbd2e7" font-size="14" text-anchor="middle"><text x="380" y="40">捐赠博弈：b=3、c=1，邻居之间各互动一次</text><text x="380" y="265">合作方按邻居数支付成本；收益高不直接决定下一轮策略</text><text x="380" y="295">Voter 模型若让 B 复制 C，则 B 将从 C（合作）变为 D（背叛）</text></g></svg>
