<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-07-title diagram-07-desc"><title id="diagram-07-title">八节点度分布：孤立点不能消失</title><desc id="diagram-07-desc">八个节点七条边，度数分布有两个零度、四个二度和两个三度，经验频率分别为0.25，0.5，0.25；度数和14等于两倍边数。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 07 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">八节点度分布：孤立点不能消失</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  分母</text><text x="749" y="190" font-size="19" fill="#eff8ff" >n=8（含 2 个孤立节点）</text><text x="749" y="216" font-size="19" fill="#bdd2df" >不是只数有边节点</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  直方图</text><text x="749" y="295" font-size="19" fill="#eff8ff" >P(0)=2/8，P(2)=4/8</text><text x="749" y="321" font-size="19" fill="#bdd2df" >P(3)=2/8</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  检查</text><text x="749" y="400" font-size="19" fill="#eff8ff" >2×0+4×2+2×3=14</text><text x="749" y="426" font-size="19" fill="#bdd2df" >度数和 = 2m =14</text>
<path d="M 112 385 L 674 385" fill="none" stroke="#8da9ba" stroke-width="2" stroke-linecap="round" /><path d="M 112 385 L 112 180" fill="none" stroke="#8da9ba" stroke-width="2" stroke-linecap="round" />
<rect x="157" y="305" width="67" height="74" rx="7" fill="#ff9b90"/><text x="191" y="411" font-size="20" fill="#bdd2df" text-anchor="middle">0</text><text x="191" y="293" font-size="19" fill="#eff8ff" text-anchor="middle">2 个</text><text x="311" y="411" font-size="20" fill="#bdd2df" text-anchor="middle">1</text><text x="311" y="367" font-size="19" fill="#bdd2df" text-anchor="middle">0 个</text><rect x="397" y="231" width="67" height="148" rx="7" fill="#74dfc9"/><text x="431" y="411" font-size="20" fill="#bdd2df" text-anchor="middle">2</text><text x="431" y="219" font-size="19" fill="#eff8ff" text-anchor="middle">4 个</text><rect x="517" y="305" width="67" height="74" rx="7" fill="#8ecaff"/><text x="551" y="411" font-size="20" fill="#bdd2df" text-anchor="middle">3</text><text x="551" y="293" font-size="19" fill="#eff8ff" text-anchor="middle">2 个</text>
<text x="393" y="165" font-size="21" fill="#ffcc87" text-anchor="middle">不同度数的节点数量</text><text x="404" y="443" font-size="17" fill="#bdd2df" text-anchor="middle">横轴：节点度数 k</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观察结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >数值均为教学算例</text></svg>
