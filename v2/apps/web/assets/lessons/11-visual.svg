<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-11-title diagram-11-desc"><title id="diagram-11-title">一个节点可以属于两个社团</title><desc id="diagram-11-desc">共享节点X位于左侧三角形ABX与右侧三角形XCD之间，L1与L2是各自只连一边的叶节点，二核会删除两片叶子但保留两个三角形。</desc><defs><marker id="arr-11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ecaff"/></marker></defs><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 11 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">一个节点可以属于两个社团</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  重叠结构</text><text x="749" y="190" font-size="19" fill="#eff8ff" >X 属于左、右两个三角形</text><text x="749" y="216" font-size="19" fill="#bdd2df" >不必给它唯一社团标签</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  核分解</text><text x="749" y="295" font-size="19" fill="#eff8ff" >2-core 要求核内每点度≥2</text><text x="749" y="321" font-size="19" fill="#bdd2df" >两片叶子将被剥离</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  区别</text><text x="749" y="400" font-size="19" fill="#eff8ff" >重叠社团表示成员身份</text><text x="749" y="426" font-size="19" fill="#bdd2df" >k-core 表示最低核内度数</text>
