<path d="M 129 223 L 77 355" fill="none" stroke="#8da9ba" stroke-width="4" stroke-linecap="round" /><path d="M 583 222 L 641 355" fill="none" stroke="#8da9ba" stroke-width="4" stroke-linecap="round" />
<circle cx="129" cy="223" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="129" y="230" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="239" cy="223" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="239" y="230" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="328" cy="311" r="23" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="328" y="318" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">X</text><circle cx="453" cy="222" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="453" y="229" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="583" cy="222" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="583" y="229" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">D</text>
<circle cx="77" cy="355" r="23" fill="#8da9ba" stroke="#0c2733" stroke-width="3"/><text x="77" y="362" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">L1</text><circle cx="641" cy="355" r="23" fill="#8da9ba" stroke="#0c2733" stroke-width="3"/><text x="641" y="362" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">L2</text>
<text x="355" y="409" font-size="19" fill="#ffcc87" text-anchor="middle">X：两个社团共用</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：观测结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >仅用于定义和机制核对</text></svg>
