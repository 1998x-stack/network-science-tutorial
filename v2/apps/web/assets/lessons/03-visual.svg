<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-03-title diagram-03-desc"><title id="diagram-03-title">一张四节点图，核对四种结构量</title><desc id="diagram-03-desc">A B C构成三角形，C连接叶节点D；四节点四边，度数之和为8，密度为四除以六。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 03 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">一张四节点图，核对四种结构量</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  图</text><text x="749" y="190" font-size="19" fill="#eff8ff" >三角形 A-B-C + 尾边 C-D</text><text x="749" y="216" font-size="19" fill="#bdd2df" >n=4，m=4</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  度数</text><text x="749" y="295" font-size="19" fill="#eff8ff" >A:2  B:2  C:3  D:1</text><text x="749" y="321" font-size="19" fill="#bdd2df" >Σdeg = 8 = 2m</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  密度</text><text x="749" y="400" font-size="19" fill="#eff8ff" >4 条实边 / 6 种可能</text><text x="749" y="426" font-size="19" fill="#bdd2df" >ρ = 2/3 ≈ 0.667</text>
<path d="M 130 265 L 332 265" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 130 265 L 235 175" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 332 265 L 235 175" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" /><path d="M 235 175 L 235 378" fill="none" stroke="#8ecaff" stroke-width="5" stroke-linecap="round" />
<circle cx="130" cy="265" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="130" y="272" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">A</text><circle cx="332" cy="265" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="332" y="272" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">B</text><circle cx="235" cy="175" r="29" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="235" y="182" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">C</text><circle cx="235" cy="378" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="235" y="385" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">D</text>
<rect x="424" y="212" width="241" height="134" rx="15" fill="#143247" stroke="#2f5268" stroke-width="2"/><text x="546" y="254" font-size="27" fill="#74dfc9" text-anchor="middle" font-weight="700">Σdeg = 8</text><text x="546" y="304" font-size="29" fill="#ffcc87" text-anchor="middle">ρ = 4 / 6</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观察结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >数值均为教学算例</text></svg>
