<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="n25b-title n25b-desc"><title id="n25b-title">星形图的随机游走抽样偏差</title><desc id="n25b-desc">K一五星形图有中心一个叶子五个。均匀选点中心概率六分之一；基本随机游走平稳分布下中心访问比例二分之一。</desc><rect x="1" y="1" width="918" height="368" rx="22" fill="#10283b" stroke="#34556e"/><g font-family="system-ui,'PingFang SC',sans-serif">
 <path d="M575 196 L600 100" stroke="#7cbbbc" stroke-width="5" fill="none"/><path d="M575 196 L760 158" stroke="#7cbbbc" stroke-width="5" fill="none"/><path d="M575 196 L720 276" stroke="#7cbbbc" stroke-width="5" fill="none"/><path d="M575 196 L460 275" stroke="#7cbbbc" stroke-width="5" fill="none"/><path d="M575 196 L425 160" stroke="#7cbbbc" stroke-width="5" fill="none"/>
 <circle cx="575" cy="196" r="48" fill="#ae7040" stroke="#edf2ea" stroke-width="3"/><text x="575" y="205" fill="#fff" font-size="29" text-anchor="middle">H</text>
 <circle cx="600" cy="100" r="27" fill="#29777f" stroke="#d9ebed" stroke-width="2"/><text x="600" y="107" text-anchor="middle" fill="white" font-size="22">1</text><circle cx="760" cy="158" r="27" fill="#29777f" stroke="#d9ebed" stroke-width="2"/><text x="760" y="165" text-anchor="middle" fill="white" font-size="22">2</text><circle cx="720" cy="276" r="27" fill="#29777f" stroke="#d9ebed" stroke-width="2"/><text x="720" y="283" text-anchor="middle" fill="white" font-size="22">3</text><circle cx="460" cy="275" r="27" fill="#29777f" stroke="#d9ebed" stroke-width="2"/><text x="460" y="282" text-anchor="middle" fill="white" font-size="22">4</text><circle cx="425" cy="160" r="27" fill="#29777f" stroke="#d9ebed" stroke-width="2"/><text x="425" y="167" text-anchor="middle" fill="white" font-size="22">5</text>
 <text x="42" y="74" fill="#9af0df" font-size="25" font-weight="700">中心 H 被抽中的比例</text><text x="42" y="156" fill="#e9f3f6" font-size="22">均匀选点：1/6 ≈ 0.1667</text><text x="42" y="202" fill="#f4c58d" font-size="22">随机游走稳态：5/10 = 0.5</text><text x="42" y="272" fill="#cbdde7" font-size="17">有限步随机游走未必</text><text x="42" y="300" fill="#cbdde7" font-size="17">达到稳态；依起点与步数变化。</text></g></svg>
