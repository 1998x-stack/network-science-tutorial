<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 337" role="img" aria-labelledby="title desc"><title id="title">同为七节点六边的星形与路径</title><desc id="desc">左侧星形中心节点0连接六片叶子；右侧路径节点0到6顺序相连。中心0或路径中点3用橙色标出；删除二者后最大连通分量大小分别为1和3。</desc><rect width="760" height="337" rx="18" fill="#102238"/>
<text x="187" y="28" text-anchor="middle" fill="#d9eaff" font-size="16">星形：删除 0 → LCC=1</text><text x="555" y="28" text-anchor="middle" fill="#d9eaff" font-size="16">路径：删除 3 → LCC=3</text>
<line x1="190" y1="164" x2="115" y2="70" stroke="#7798af" stroke-width="3.5"/><line x1="190" y1="164" x2="190" y2="49" stroke="#7798af" stroke-width="3.5"/><line x1="190" y1="164" x2="265" y2="70" stroke="#7798af" stroke-width="3.5"/><line x1="190" y1="164" x2="282" y2="225" stroke="#7798af" stroke-width="3.5"/><line x1="190" y1="164" x2="190" y2="279" stroke="#7798af" stroke-width="3.5"/><line x1="190" y1="164" x2="98" y2="225" stroke="#7798af" stroke-width="3.5"/>
<circle cx="190" cy="164" r="28" fill="#f4bc7c" stroke="#f7f9ff" stroke-width="2"/><text x="190" y="169" text-anchor="middle" fill="#122234" font-size="15" font-weight="800">0</text><circle cx="115" cy="70" r="19" fill="#70dbc3" stroke="#f7f9ff" stroke-width="2"/><text x="115" y="75" text-anchor="middle" fill="#122234" font-size="15" font-weight="800">1</text><circle cx="190" cy="49" r="19" fill="#70dbc3" stroke="#f7f9ff" stroke-width="2"/><text x="190" y="54" text-anchor="middle" fill="#122234" font-size="15" font-weight="800">2</text><circle cx="265" cy="70" r="19" fill="#70dbc3" stroke="#f7f9ff" stroke-width="2"/><text x="265" y="75" text-anchor="middle" fill="#122234" font-size="15" font-weight="800">3</text><circle cx="282" cy="225" r="19" fill="#70dbc3" stroke="#f7f9ff" stroke-width="2"/><text x="282" y="230" text-anchor="middle" fill="#122234" font-size="15" font-weight="800">4</text><circle cx="190" cy="279" r="19" fill="#70dbc3" stroke="#f7f9ff" stroke-width="2"/><text x="190" y="284" text-anchor="middle" fill="#122234" font-size="15" font-weight="800">5</text><circle cx="98" cy="225" r="19" fill="#70dbc3" stroke="#f7f9ff" stroke-width="2"/><text x="98" y="230" text-anchor="middle" fill="#122234" font-size="15" font-weight="800">6</text>
