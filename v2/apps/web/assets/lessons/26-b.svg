<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="f26b-title f26b-desc"><title id="f26b-title">时间外图推荐评估</title><desc id="f26b-desc">训练窗口一到三周，测试窗口第四周，未来边不能反流。</desc><rect x="1" y="1" width="958" height="378" rx="23" fill="#112739" stroke="#40657a"/><g font-family="system-ui,'PingFang SC',sans-serif"><rect x="65" y="100" width="290" height="152" rx="18" fill="#21546b" stroke="#76ccb6"/><rect x="605" y="100" width="290" height="152" rx="18" fill="#6f493c" stroke="#f2b984"/><text x="210" y="156" font-size="25" fill="#fff" text-anchor="middle">第 1–3 周</text><text x="210" y="198" font-size="19" fill="#fff" text-anchor="middle">训练图 + 图传播</text><text x="750" y="156" font-size="25" fill="#fff" text-anchor="middle">第 4 周</text><text x="750" y="198" font-size="19" fill="#fff" text-anchor="middle">未来边仅作为标签</text><path d="M367 175 H590" stroke="#9fe8d1" stroke-width="5" fill="none"/><path d="M579 161 l15 14 -15 14" stroke="#9fe8d1" stroke-width="4" fill="none"/><path d="M765 268 V321 H207 V268" stroke="#eb9788" stroke-width="3" stroke-dasharray="10 8" fill="none"/><text x="480" y="309" font-size="20" fill="#ffd3ba" text-anchor="middle">禁止从测试图返回训练邻接</text></g></svg>
