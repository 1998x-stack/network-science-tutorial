<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="n23b-title n23b-desc"><title id="n23b-title">从边表到验证的图分析管线</title><desc id="n23b-desc">边表、节点全集、图对象、黄金断言、指标和结构化报告六步串联，每步保留明确语义。</desc><rect x="1" y="1" width="918" height="368" rx="22" fill="#10283b" stroke="#34556e"/><g font-family="system-ui,'PingFang SC',sans-serif">
 <rect x="18" y="47" width="270" height="99" rx="13" fill="#173d57" stroke="#70c7b5"/><text x="153" y="86" fill="#9ff3df" font-weight="700" font-size="20" text-anchor="middle">事件来源</text><text x="153" y="122" fill="#d8e6ec" font-size="16" text-anchor="middle">节点/边含义</text><rect x="320" y="47" width="270" height="99" rx="13" fill="#173d57" stroke="#70c7b5"/><text x="455" y="86" fill="#9ff3df" font-weight="700" font-size="20" text-anchor="middle">节点全集</text><text x="455" y="122" fill="#d8e6ec" font-size="16" text-anchor="middle">包含孤立 G</text><rect x="622" y="47" width="270" height="99" rx="13" fill="#173d57" stroke="#70c7b5"/><text x="757" y="86" fill="#9ff3df" font-weight="700" font-size="20" text-anchor="middle">Graph / DiGraph</text><text x="757" y="122" fill="#d8e6ec" font-size="16" text-anchor="middle">方向与去重</text><rect x="18" y="197" width="270" height="99" rx="13" fill="#173d57" stroke="#70c7b5"/><text x="153" y="236" fill="#9ff3df" font-weight="700" font-size="20" text-anchor="middle">断言检查</text><text x="153" y="272" fill="#d8e6ec" font-size="16" text-anchor="middle">n,m,分量</text><rect x="320" y="197" width="270" height="99" rx="13" fill="#173d57" stroke="#70c7b5"/><text x="455" y="236" fill="#9ff3df" font-weight="700" font-size="20" text-anchor="middle">计算指标</text><text x="455" y="272" fill="#d8e6ec" font-size="16" text-anchor="middle">密度/桥/路径</text><rect x="622" y="197" width="270" height="99" rx="13" fill="#173d57" stroke="#70c7b5"/><text x="757" y="236" fill="#9ff3df" font-weight="700" font-size="20" text-anchor="middle">报告归档</text><text x="757" y="272" fill="#d8e6ec" font-size="16" text-anchor="middle">版本与元数据</text>
 <text x="460" y="349" text-anchor="middle" fill="#bcd9e5" font-size="16">顺序是可复核分析协议，不是自动生成图的工具。</text></g></svg>
