<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-06-title diagram-06-desc"><title id="diagram-06-title">优先连接：高度节点更容易被选中</title><desc id="diagram-06-desc">旧网络有5条无向边总度10，节点A度3和节点E度1，选择概率分别是3除以10与1除以10，另有剩余节点贡献总度6。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 06 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">优先连接：高度节点更容易被选中</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  观察</text><text x="749" y="190" font-size="19" fill="#eff8ff" >旧网络 5 条边</text><text x="749" y="216" font-size="19" fill="#bdd2df" >总度数 Σk=10</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  概率</text><text x="749" y="295" font-size="19" fill="#eff8ff" >P(A)=3/10=30%</text><text x="749" y="321" font-size="19" fill="#bdd2df" >P(E)=1/10=10%</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  限制</text><text x="749" y="400" font-size="19" fill="#eff8ff" >不是保证会连到 A</text><text x="749" y="426" font-size="19" fill="#bdd2df" >一次随机试验不代表幂律</text>
<text x="82" y="203" font-size="22" fill="#bdd2df" >旧节点度数</text><text x="82" y="277" font-size="26" fill="#74dfc9" font-weight="760">A</text><rect x="145" y="247" width="297" height="42" rx="7" fill="#74dfc9"/><text x="461" y="274" font-size="23" fill="#eff8ff" >3 / 10</text>
<text x="82" y="354" font-size="26" fill="#ffcc87" font-weight="760">E</text><rect x="145" y="323" width="99" height="42" rx="7" fill="#ffcc87"/><text x="269" y="349" font-size="23" fill="#eff8ff" >1 / 10</text>
<text x="102" y="414" font-size="18" fill="#bdd2df" >条形长度 = 每次被选中的相对概率</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观察结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >数值均为教学算例</text></svg>
