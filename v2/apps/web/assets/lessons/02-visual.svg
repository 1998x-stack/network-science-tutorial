<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-02-title diagram-02-desc"><title id="diagram-02-title">同一张图，三种等价记录方式</title><desc id="diagram-02-desc">四节点无向路径A-B-C-D的边表是AB BC CD，邻接矩阵对称且对角线为零。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 02 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">同一张图，三种等价记录方式</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  图结构</text><text x="749" y="190" font-size="19" fill="#eff8ff" >A—B—C—D</text><text x="749" y="216" font-size="19" fill="#bdd2df" >四节点、三条无向边</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  邻接矩阵</text><text x="749" y="295" font-size="19" fill="#eff8ff" >对称：Aᵢⱼ=Aⱼᵢ</text><text x="749" y="321" font-size="19" fill="#bdd2df" >对角线全部为零</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  独立核对</text><text x="749" y="400" font-size="19" fill="#eff8ff" >边表：AB, BC, CD</text><text x="749" y="426" font-size="19" fill="#bdd2df" >度数和 1+2+2+1=6</text>
