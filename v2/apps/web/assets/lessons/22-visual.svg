<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-22-title diagram-22-desc"><title id="diagram-22-title">GCN：对称归一化不等于取平均</title><desc id="diagram-22-desc">A-B-C三节点路径加入每个节点自环，若xA为1其余为0则一次无参数线性GCN在B的结果是1除以根号6，算术均值则为1除以3。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 22 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">GCN：对称归一化不等于取平均</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  小图输入</text><text x="749" y="190" font-size="19" fill="#eff8ff" >路径 A—B—C</text><text x="749" y="216" font-size="19" fill="#bdd2df" >每个节点加入自环</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  信号</text><text x="749" y="295" font-size="19" fill="#eff8ff" >x=(1,0,0)，W=1</text><text x="749" y="321" font-size="19" fill="#bdd2df" >无非线性、单层传播</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  B 的结果</text><text x="749" y="400" font-size="19" fill="#eff8ff" >GCN = 1/√6 ≈ 0.408</text><text x="749" y="426" font-size="19" fill="#bdd2df" >普通均值 = 1/3</text>
<path d="M148 253 L318 253" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M318 253 L495 253" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" />
<circle cx="148" cy="253" r="28" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="148" y="260" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><path d="M 128 220 C 96 143, 200 143, 168 220" stroke="#8da9ba" stroke-width="3" fill="none"/><circle cx="318" cy="253" r="28" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="318" y="260" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><path d="M 298 220 C 266 143, 370 143, 338 220" stroke="#8da9ba" stroke-width="3" fill="none"/><circle cx="495" cy="253" r="28" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="495" y="260" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><path d="M 475 220 C 443 143, 547 143, 515 220" stroke="#8da9ba" stroke-width="3" fill="none"/>
<text x="148" y="346" font-size="22" fill="#ffcc87" text-anchor="middle">x=1</text><text x="318" y="346" font-size="22" fill="#bdd2df" text-anchor="middle">x=0</text><text x="495" y="346" font-size="22" fill="#bdd2df" text-anchor="middle">x=0</text>
<text x="350" y="416" font-size="21" fill="#ffcc87" text-anchor="middle">B 收到来自 A 的 1/√(2×3)</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观测输入或结构</text><text x="270" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或边界</text><text x="755" y="483" font-size="16" fill="#bdd2df" >本页均明确区分事实与示例</text></svg>
