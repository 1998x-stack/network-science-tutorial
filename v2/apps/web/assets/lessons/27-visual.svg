<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-27-title diagram-27-desc"><title id="diagram-27-title">观察差异：混杂因素可能解释全部关联</title><desc id="diagram-27-desc">因果图Z同时指向曝光X和采纳Y，X到Y没有已识别因果边。合成分层表中每层曝光与否的采纳率相同，合并后表观差为18个百分点。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 27 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">观察差异：混杂因素可能解释全部关联</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  生成机制</text><text x="749" y="190" font-size="19" fill="#eff8ff" >共同原因 Z → X，Z → Y</text><text x="749" y="216" font-size="19" fill="#bdd2df" >不预设 X → Y 因果</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  分层结果</text><text x="749" y="295" font-size="19" fill="#eff8ff" >低风险两组都 10%</text><text x="749" y="321" font-size="19" fill="#bdd2df" >高风险两组都 40%</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  合并之后</text><text x="749" y="400" font-size="19" fill="#eff8ff" >34% vs 16%，差 18 pp</text><text x="749" y="426" font-size="19" fill="#bdd2df" >这是观察关联，不是处理效应</text>
<path d="M348 197 L178 343" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M348 197 L527 343" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" />
<circle cx="348" cy="193" r="30" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="348" y="200" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">Z</text><circle cx="178" cy="343" r="30" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="178" y="350" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">X</text><circle cx="527" cy="343" r="30" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="527" y="350" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">Y</text>
<text x="348" y="155" font-size="19" fill="#ffcc87" text-anchor="middle">共同原因</text>
<path d="M214 343 L486 343" stroke="#ff9b90" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="10 8"/>
<text x="346" y="327" font-size="19" fill="#ff9b90" text-anchor="middle">不作因果结论</text>
<text x="348" y="417" font-size="20" fill="#bdd2df" text-anchor="middle">合并关联 +18 pp，层内差为 0</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观测输入或结构</text><text x="270" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或边界</text><text x="755" y="483" font-size="16" fill="#bdd2df" >本页均明确区分事实与示例</text></svg>
