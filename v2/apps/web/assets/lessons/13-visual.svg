<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-13-title diagram-13-desc"><title id="diagram-13-title">复杂传播：F 只有一个可见采纳邻居</title><desc id="diagram-13-desc">在明确的示例图中F只有E一位邻居，即使E采纳，阈值为2时F仍不能采纳；阈值为1时可沿连通边逐步传播。</desc><defs><marker id="arr-13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ecaff"/></marker></defs><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 13 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">复杂传播：F 只有一个可见采纳邻居</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  初始状态</text><text x="749" y="190" font-size="19" fill="#eff8ff" >A、B 是最初采纳者</text><text x="749" y="216" font-size="19" fill="#bdd2df" >同步轮次使用上一轮状态</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  阈值 1</text><text x="749" y="295" font-size="19" fill="#eff8ff" >一名已采纳邻居足够</text><text x="749" y="321" font-size="19" fill="#bdd2df" >F 最终可以采纳</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  阈值 2</text><text x="749" y="400" font-size="19" fill="#eff8ff" >F 的唯一邻居是 E</text><text x="749" y="426" font-size="19" fill="#bdd2df" >无法凑满两位邻居</text>
<path d="M 124 260 L 270 211" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 124 260 L 270 327" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" />
<path d="M 270 211 L 394 265" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 270 327 L 394 265" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" />
<path d="M 394 265 L 528 265" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 528 265 L 627 265" fill="none" stroke="#ffcc87" stroke-width="5" stroke-linecap="round" />
<circle cx="124" cy="260" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="124" y="267" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="270" cy="211" r="29" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="270" y="218" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="270" cy="327" r="29" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="270" y="334" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="394" cy="265" r="29" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="394" y="272" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><circle cx="528" cy="265" r="29" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="528" y="272" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">E</text><circle cx="627" cy="265" r="29" fill="#ff9b90" stroke="#0c2733" stroke-width="3"/><text x="627" y="272" font-size="22" fill="#0b1828" text-anchor="middle" font-weight="740">F</text>
<text x="598" y="198" font-size="20" fill="#ff9b90" text-anchor="middle">F 的度 = 1</text>
<text x="348" y="414" font-size="17" fill="#bdd2df" text-anchor="middle">A、B 是种子；图为阈值机制的说明结构</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：观测结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >仅用于定义和机制核对</text></svg>
