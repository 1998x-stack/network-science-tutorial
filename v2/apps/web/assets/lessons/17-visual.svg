<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-17-title diagram-17-desc"><title id="diagram-17-title">坐标改变，图的边集不变</title><desc id="diagram-17-desc">六个节点A-F与七条无向边AB AC BC CD DE DF EF，在手工结构布局和圆形布局里完全相同，视觉距离不能推出真实社会距离。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 17 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">坐标改变，图的边集不变</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  图契约</text><text x="749" y="190" font-size="19" fill="#eff8ff" >A…F 共 6 个节点</text><text x="749" y="216" font-size="19" fill="#bdd2df" >七条边固定不变</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  布局变换</text><text x="749" y="295" font-size="19" fill="#eff8ff" >仅更换 x/y 坐标</text><text x="749" y="321" font-size="19" fill="#bdd2df" >邻接、度数和路径不变</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  警惕误读</text><text x="749" y="400" font-size="19" fill="#eff8ff" >屏幕上近 ≠ 图距离近</text><text x="749" y="426" font-size="19" fill="#bdd2df" >布局不是因果解释</text>
