name: Sync reviewed chapter snapshots
on:
  push:
    branches: [main]
    paths:
      - '[0-2][0-9].html'
      - 'v2/content/evidence/**'
      - 'v2/scripts/build_web.py'
      - 'v2/apps/web/site.css'
      - '.github/workflows/sync-reviewed-chapters.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-chapter-sync
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild deterministic V2 snapshots from root sources
        run: |
          python3 v2/scripts/migrate_lessons.py
          python3 v2/scripts/build_web.py
          python3 v2/scripts/migrate_lessons.py --check
          python3 v2/scripts/build_web.py --check
      - name: Commit reviewed chapter outputs only
        run: |
          for n in $(seq -w 01 28); do
            git add "v2/content/lessons/${n}.html" "v2/content/lessons/${n}.json"
            git add "v2/content/examples/${n}/"
            git add "v2/content/quizzes/${n}.json"
            git add "v2/apps/web/lessons/${n}.html"
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(netsci): synchronize all 28 reviewed lessons to V2"
            git push origin HEAD:main
          else
            echo "All reviewed chapter artifacts are synchronized"
          fi
