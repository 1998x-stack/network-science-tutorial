<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-25-title diagram-25-desc"><title id="diagram-25-title">大图存储：先列出数组的理论字节数</title><desc id="diagram-25-desc">一百万节点和五百万条无向边的例子，float64全密邻接矩阵需要8TB十进制；若每条无向边存双向CSR且indptr indices data均为64位，理论数组大小约168MB，不含对象开销。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 25 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">大图存储：先列出数组的理论字节数</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  密集邻接</text><text x="749" y="190" font-size="19" fill="#eff8ff" >n=1,000,000，float64</text><text x="749" y="216" font-size="19" fill="#bdd2df" >8n² = 8 TB（十进制）</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  CSR 假设</text><text x="749" y="295" font-size="19" fill="#eff8ff" >无向边 m=5,000,000</text><text x="749" y="321" font-size="19" fill="#bdd2df" >双向 2m；索引与数据 64 位</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  基础数组</text><text x="749" y="400" font-size="19" fill="#eff8ff" >indptr+indices+data</text><text x="749" y="426" font-size="19" fill="#bdd2df" >约 168 MB，非峰值内存</text>
<rect x="73" y="197" width="254" height="213" rx="18" fill="#2b4052" stroke="#7094a8" stroke-width="2"/>
<text x="200" y="251" font-size="26" fill="#8ecaff" text-anchor="middle" font-weight="740">Dense</text>
<text x="200" y="310" font-size="47" fill="#eff8ff" text-anchor="middle" font-weight="780">8 TB</text>
<text x="200" y="367" font-size="21" fill="#bdd2df" text-anchor="middle">n × n</text>
<rect x="372" y="197" width="268" height="213" rx="18" fill="#214e53" stroke="#6bd9c4" stroke-width="2"/>
<text x="505" y="251" font-size="26" fill="#74dfc9" text-anchor="middle" font-weight="740">CSR</text>
<text x="505" y="310" font-size="39" fill="#eff8ff" text-anchor="middle" font-weight="780">168 MB</text>
<text x="505" y="367" font-size="20" fill="#bdd2df" text-anchor="middle">2m + indptr</text>
<text x="352" y="435" font-size="17" fill="#ffcc87" text-anchor="middle">盒子并非线性尺度，大小由公式确定</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观测输入或结构</text><text x="270" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或边界</text><text x="755" y="483" font-size="16" fill="#bdd2df" >本页均明确区分事实与示例</text></svg>
