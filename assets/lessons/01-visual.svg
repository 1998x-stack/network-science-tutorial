<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-01-title diagram-01-desc"><title id="diagram-01-title">从实体清单，到可计算的关系</title><desc id="diagram-01-desc">站点、研究者、蛋白三类节点语义不同，但研究者把明确关系抽象为图G等于V和E；不应把一条边误认为同一种因果关系。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 01 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">从实体清单，到可计算的关系</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  观察</text><text x="749" y="190" font-size="19" fill="#eff8ff" >实体可以是站点、作者</text><text x="749" y="216" font-size="19" fill="#bdd2df" >也可以是蛋白质</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  建模</text><text x="749" y="295" font-size="19" fill="#eff8ff" >明确 V 的对象和 E 的关系</text><text x="749" y="321" font-size="19" fill="#bdd2df" >才得到 G=(V,E)</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  不能推出</text><text x="749" y="400" font-size="19" fill="#eff8ff" >同样形状的边 ≠ 相同</text><text x="749" y="426" font-size="19" fill="#bdd2df" >领域含义或因果作用</text>
<rect x="85" y="176" width="183" height="128" rx="15" fill="#143247" stroke="#2f5268" stroke-width="2"/><text x="176" y="209" font-size="20" fill="#74dfc9" text-anchor="middle" font-weight="720">交通</text><circle cx="144" cy="253" r="18" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="144" y="260" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">A</text><circle cx="211" cy="253" r="18" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="211" y="260" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">B</text><path d="M 163 253 L 192 253" fill="none" stroke="#ffcc87" stroke-width="5" stroke-linecap="round" /><text x="176" y="291" font-size="18" fill="#bdd2df" text-anchor="middle">站点</text><rect x="291" y="176" width="183" height="128" rx="15" fill="#143247" stroke="#2f5268" stroke-width="2"/><text x="382" y="209" font-size="20" fill="#74dfc9" text-anchor="middle" font-weight="720">学术</text><circle cx="350" cy="253" r="18" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="350" y="260" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">A</text><circle cx="417" cy="253" r="18" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="417" y="260" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">B</text><path d="M 369 253 L 398 253" fill="none" stroke="#ffcc87" stroke-width="5" stroke-linecap="round" /><text x="382" y="291" font-size="18" fill="#bdd2df" text-anchor="middle">作者</text><rect x="497" y="176" width="183" height="128" rx="15" fill="#143247" stroke="#2f5268" stroke-width="2"/><text x="588" y="209" font-size="20" fill="#74dfc9" text-anchor="middle" font-weight="720">生物</text><circle cx="556" cy="253" r="18" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="556" y="260" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">A</text><circle cx="623" cy="253" r="18" fill="#8ecaff" stroke="#0c2733" stroke-width="3"/><text x="623" y="260" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">B</text><path d="M 575 253 L 604 253" fill="none" stroke="#ffcc87" stroke-width="5" stroke-linecap="round" /><text x="588" y="291" font-size="18" fill="#bdd2df" text-anchor="middle">蛋白</text>
<text x="376" y="356" font-size="20" fill="#ffcc87" text-anchor="middle">统一数学写法</text>
<text x="376" y="396" font-size="34" fill="#eff8ff" text-anchor="middle" font-weight="750">G = (V, E)</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观察结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >数值均为教学算例</text></svg>
