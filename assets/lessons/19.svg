<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">双层 multiplex 图</title><desc id="desc">社交层上A-B、B-C两条边，合作层A-C、C-D两条边。同一实体的上下节点由虚线一对一耦合。多层中B社交到D合作的路径是B社交、C社交、C合作、D合作。</desc><rect width="760" height="340" rx="18" fill="#102238"/><rect x="35" y="55" width="690" height="105" rx="13" fill="#15394b"/><rect x="35" y="190" width="690" height="105" rx="13" fill="#182f51"/><line x1="105" y1="108" x2="285" y2="108" stroke="#70dbc3" stroke-width="4.5"/><line x1="285" y1="108" x2="465" y2="108" stroke="#70dbc3" stroke-width="4.5"/><line x1="105" y1="239" x2="465" y2="239" stroke="#85b5ff" stroke-width="4.5"/><line x1="465" y1="239" x2="645" y2="239" stroke="#85b5ff" stroke-width="4.5"/><line x1="105" y1="132" x2="105" y2="215" stroke="#f4bc7c" stroke-width="3" stroke-dasharray="7 7"/><line x1="285" y1="132" x2="285" y2="215" stroke="#f4bc7c" stroke-width="3" stroke-dasharray="7 7"/><line x1="465" y1="132" x2="465" y2="215" stroke="#f4bc7c" stroke-width="3" stroke-dasharray="7 7"/><line x1="645" y1="132" x2="645" y2="215" stroke="#f4bc7c" stroke-width="3" stroke-dasharray="7 7"/><circle cx="105" cy="108" r="24" fill="#70dbc3" stroke="#fff" stroke-width="2"/><text x="105" y="114" text-anchor="middle" font-size="18" fill="#102235" font-weight="800">A</text><circle cx="285" cy="108" r="24" fill="#70dbc3" stroke="#fff" stroke-width="2"/><text x="285" y="114" text-anchor="middle" font-size="18" fill="#102235" font-weight="800">B</text><circle cx="465" cy="108" r="24" fill="#70dbc3" stroke="#fff" stroke-width="2"/><text x="465" y="114" text-anchor="middle" font-size="18" fill="#102235" font-weight="800">C</text><circle cx="645" cy="108" r="24" fill="#70dbc3" stroke="#fff" stroke-width="2"/><text x="645" y="114" text-anchor="middle" font-size="18" fill="#102235" font-weight="800">D</text><circle cx="105" cy="239" r="24" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="105" y="245" text-anchor="middle" font-size="18" fill="#102235" font-weight="800">A</text><circle cx="285" cy="239" r="24" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="285" y="245" text-anchor="middle" font-size="18" fill="#102235" font-weight="800">B</text><circle cx="465" cy="239" r="24" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="465" y="245" text-anchor="middle" font-size="18" fill="#102235" font-weight="800">C</text><circle cx="645" cy="239" r="24" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="645" y="245" text-anchor="middle" font-size="18" fill="#102235" font-weight="800">D</text><text x="35" y="37" fill="#70dbc3" font-size="16">社交层</text><text x="35" y="184" fill="#85b5ff" font-size="16">合作层</text><text x="380" y="325" fill="#d9eaf6" text-anchor="middle" font-size="14">虚线表示同一实体跨层切换，而非层内的新边 · 共 8 节点层状态</text></svg>
