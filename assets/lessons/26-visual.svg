<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-26-title diagram-26-desc"><title id="diagram-26-title">推荐传播：测试边也会改变训练权重</title><desc id="diagram-26-desc">二部图中用户U1连接X Y，U2连接Y；无自环LightGCN的U1X权重1除以根号2。若未来U2X边提前加入，X度变2，U1X权重变为1/2。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 26 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">推荐传播：测试边也会改变训练权重</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  观察边</text><text x="749" y="190" font-size="19" fill="#eff8ff" >U1—X，U1—Y，U2—Y</text><text x="749" y="216" font-size="19" fill="#bdd2df" >尚未看到 U2—X</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  初始系数</text><text x="749" y="295" font-size="19" fill="#eff8ff" >U1—X = 1/√(2×1)</text><text x="749" y="321" font-size="19" fill="#bdd2df" >≈0.7071</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  未来泄漏</text><text x="749" y="400" font-size="19" fill="#eff8ff" >U2—X 若提前进入训练</text><text x="749" y="426" font-size="19" fill="#bdd2df" >U1—X 变为 1/2</text>
<path d="M186 215 L526 200" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M186 215 L526 362" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><path d="M186 363 L526 362" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" />
<path d="M186 363 L526 200" stroke="#ff9b90" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="10 8"/>
<circle cx="186" cy="215" r="32" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="186" y="222" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">U1</text><circle cx="186" cy="363" r="32" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="186" y="370" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">U2</text><circle cx="526" cy="200" r="32" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="526" y="207" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">X</text><circle cx="526" cy="362" r="32" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="526" y="369" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">Y</text>
<text x="354" y="228" font-size="21" fill="#ffcc87" text-anchor="middle">1/√2 → 1/2</text>
<text x="352" y="326" font-size="19" fill="#ff9b90" text-anchor="middle">橙色虚线 = 未来互动</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观测输入或结构</text><text x="270" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或边界</text><text x="755" y="483" font-size="16" fill="#bdd2df" >本页均明确区分事实与示例</text></svg>
