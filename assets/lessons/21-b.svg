<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="n21b-title n21b-desc"><title id="n21b-title">DeepWalk 的节点序列生成和窗口上下文</title><desc id="n21b-desc">先从原图抽样随机游走 A B C B D，再在中心 C 的左右两步范围内得到 A B B D，形成中心节点—上下文配对，后续才训练向量。</desc><rect x="1" y="1" width="918" height="368" rx="22" fill="#10283b" stroke="#34556e"/><g font-family="system-ui,'PingFang SC',sans-serif">
    <text x="38" y="54" fill="#a2e7d8" font-size="21" font-weight="700">① 随机游走 → 节点序列</text>
    <rect x="60" y="83" width="104" height="80" rx="14" fill="#24516b" stroke="#70dbc3"/><text x="112" y="131" font-size="27" fill="white" text-anchor="middle">A</text><path d="M168 122 h42" stroke="#d9e9f4" stroke-width="3"/><path d="M203 115 l10 7 -10 7" fill="none" stroke="#d9e9f4" stroke-width="3"/><rect x="212" y="83" width="104" height="80" rx="14" fill="#24516b" stroke="#70dbc3"/><text x="264" y="131" font-size="27" fill="white" text-anchor="middle">B</text><path d="M320 122 h42" stroke="#d9e9f4" stroke-width="3"/><path d="M355 115 l10 7 -10 7" fill="none" stroke="#d9e9f4" stroke-width="3"/><rect x="364" y="83" width="104" height="80" rx="14" fill="#9b642e" stroke="#70dbc3"/><text x="416" y="131" font-size="27" fill="white" text-anchor="middle">C</text><path d="M472 122 h42" stroke="#d9e9f4" stroke-width="3"/><path d="M507 115 l10 7 -10 7" fill="none" stroke="#d9e9f4" stroke-width="3"/><rect x="516" y="83" width="104" height="80" rx="14" fill="#24516b" stroke="#70dbc3"/><text x="568" y="131" font-size="27" fill="white" text-anchor="middle">B</text><path d="M624 122 h42" stroke="#d9e9f4" stroke-width="3"/><path d="M659 115 l10 7 -10 7" fill="none" stroke="#d9e9f4" stroke-width="3"/><rect x="668" y="83" width="104" height="80" rx="14" fill="#24516b" stroke="#70dbc3"/><text x="720" y="131" font-size="27" fill="white" text-anchor="middle">D</text>
    <text x="38" y="226" fill="#a2e7d8" font-size="21" font-weight="700">② 以 C 为中心，窗口宽度 = 2</text>
    <text x="52" y="275" fill="#e0edf6" font-size="20">训练正对：</text>
    <text x="174" y="275" fill="#f5c184" font-size="21">(C,A), (C,B), (C,B), (C,D)</text>
    <text x="54" y="329" fill="#d3e7ee" font-size="16">③ Skip-gram/负采样优化是下一步；重复出现的 B 会重复计入正对。</text></g></svg>
