<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-14-title diagram-14-desc"><title id="diagram-14-title">收益不等于下一轮策略：逐边算捐赠博弈</title><desc id="diagram-14-desc">路径A-B-C-D的初始策略为合作C、合作C、背叛D、背叛D，b=3成本c=1，四个节点收益2、1、3、0。</desc><defs><marker id="arr-14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ecaff"/></marker></defs><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 14 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">收益不等于下一轮策略：逐边算捐赠博弈</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  策略</text><text x="749" y="190" font-size="19" fill="#eff8ff" >A、B 合作（C）</text><text x="749" y="216" font-size="19" fill="#bdd2df" >C、D 背叛（D）</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  一次收益</text><text x="749" y="295" font-size="19" fill="#eff8ff" >合作贡献 b=3</text><text x="749" y="321" font-size="19" fill="#bdd2df" >自身成本 c=1 × 度</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  核对</text><text x="749" y="400" font-size="19" fill="#eff8ff" >π(A,B,C,D)=(2,1,3,0)</text><text x="749" y="426" font-size="19" fill="#bdd2df" >收益不是下一轮采纳结果</text>
