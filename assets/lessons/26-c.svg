<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="f26c-title f26c-desc"><title id="f26c-title">TransE 几何平移</title><desc id="f26c-desc">h=(1,2),r=(2,-1),t=(3,1) 满足 h+r=t。</desc><rect x="1" y="1" width="958" height="378" rx="23" fill="#112739" stroke="#40657a"/><g font-family="system-ui,'PingFang SC',sans-serif"><path d="M114 305 H873 M114 305 V55" stroke="#517d90" stroke-width="2"/><path d="M230 233 L655 120" stroke="#f2c18a" stroke-width="6" fill="none"/><path d="M640 117 l18 3 -13 15" stroke="#f2c18a" stroke-width="3" fill="none"/><circle cx="230" cy="233" r="37" fill="#236a83" stroke="#bee8e4" stroke-width="2"/><text x="230" y="241" fill="#fff" font-size="23" text-anchor="middle">h</text><circle cx="655" cy="120" r="37" fill="#b47b42" stroke="#bee8e4" stroke-width="2"/><text x="655" y="128" fill="#fff" font-size="23" text-anchor="middle">t</text><text x="230" y="290" fill="#e9eff4" font-size="20" text-anchor="middle">h=(1,2)</text><text x="665" y="69" fill="#e9eff4" font-size="20">t=(3,1)</text><text x="455" y="139" fill="#f4cf9a" font-size="23">r=(2,−1)</text><text x="478" y="356" text-anchor="middle" fill="#b9d9e4" font-size="18">几何距离为零，不构成任何现实关系或疗效证据</text></g></svg>
