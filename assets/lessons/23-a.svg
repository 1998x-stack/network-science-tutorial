<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="n23a-title n23a-desc"><title id="n23a-title">两三角形一桥一孤立点</title><desc id="n23a-desc">节点 A B C 构成三角形，D E F 构成另一个，C-D 为连接桥，G 无任何边。</desc><rect x="1" y="1" width="918" height="368" rx="22" fill="#10283b" stroke="#34556e"/><g font-family="system-ui,'PingFang SC',sans-serif">
 <g fill="none" stroke="#80b3bc" stroke-width="5"><path d="M145 95 L310 105 L220 260 Z"/><path d="M530 105 L690 95 L615 260 Z"/></g><path d="M310 105 L530 105" fill="none" stroke="#f2b271" stroke-width="7" stroke-dasharray="13 8"/>
 <circle cx="145" cy="95" r="29" fill="#23687f" stroke="#d2f2ea" stroke-width="2.5"/><text x="145" y="103" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">A</text><circle cx="310" cy="105" r="29" fill="#23687f" stroke="#d2f2ea" stroke-width="2.5"/><text x="310" y="113" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">B</text><circle cx="220" cy="260" r="29" fill="#ad713b" stroke="#d2f2ea" stroke-width="2.5"/><text x="220" y="268" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">C</text><circle cx="530" cy="105" r="29" fill="#ad713b" stroke="#d2f2ea" stroke-width="2.5"/><text x="530" y="113" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">D</text><circle cx="690" cy="95" r="29" fill="#23687f" stroke="#d2f2ea" stroke-width="2.5"/><text x="690" y="103" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">E</text><circle cx="615" cy="260" r="29" fill="#23687f" stroke="#d2f2ea" stroke-width="2.5"/><text x="615" y="268" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">F</text><circle cx="825" cy="275" r="29" fill="#5b5b78" stroke="#d2f2ea" stroke-width="2.5"/><text x="825" y="283" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">G</text>
 <text x="420" y="80" text-anchor="middle" fill="#ffd39d" font-size="19">桥：C–D ?</text>
 <text x="450" y="332" text-anchor="middle" fill="#e1eaf3" font-size="17">提示：橙色虚线应连接 C(220,260)–D(530,105)；下方数字以文字定义为准。</text></g></svg>
