<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="f27a-title f27a-desc"><title id="f27a-title">网络医学合成疾病模块</title><desc id="f27a-desc">A B C为合成互作模块，T与B的候选路径是待验证关系。</desc><rect x="1" y="1" width="958" height="378" rx="22" fill="#11293e" stroke="#467389"/><g font-family="system-ui,'PingFang SC',sans-serif"><path d="M200 110 L340 207" fill="none" stroke="#87c3c9" stroke-width="5" /><path d="M200 110 L210 288" fill="none" stroke="#87c3c9" stroke-width="5" /><path d="M210 288 L340 207" fill="none" stroke="#87c3c9" stroke-width="5" /><path d="M340 207 L620 207" fill="none" stroke="#87c3c9" stroke-width="5" stroke="#efb76f" stroke-dasharray="12 8"/><circle cx="200" cy="110" r="34" fill="#2c7183" stroke="#d1e6e8" stroke-width="2.5"/><text x="200" y="118" text-anchor="middle" fill="white" font-size="24">A</text><circle cx="210" cy="288" r="34" fill="#2c7183" stroke="#d1e6e8" stroke-width="2.5"/><text x="210" y="296" text-anchor="middle" fill="white" font-size="24">C</text><circle cx="340" cy="207" r="34" fill="#2c7183" stroke="#d1e6e8" stroke-width="2.5"/><text x="340" y="215" text-anchor="middle" fill="white" font-size="24">B</text><circle cx="620" cy="207" r="34" fill="#a4753b" stroke="#d1e6e8" stroke-width="2.5"/><text x="620" y="215" text-anchor="middle" fill="white" font-size="24">T</text><text x="60" y="59" fill="#9febd8" font-size="23">合成疾病模块</text><text x="680" y="187" fill="#f7cb97" font-size="21">候选关系</text><text x="680" y="225" fill="#d4e9ef" font-size="17">尚无临床证据</text><text x="480" y="353" text-anchor="middle" fill="#b9d5e0" font-size="17">网络邻近可以排序研究假说，但不能作为药物有效性的证明。</text></g></svg>
