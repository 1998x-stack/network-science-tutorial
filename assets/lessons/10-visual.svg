<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-10-title diagram-10-desc"><title id="diagram-10-title">社团划分：内部边多还不够</title><desc id="diagram-10-desc">两个三角形仅通过C-D一条桥相连，总边数七，每组三条内部边；和度保持的随机连线基线比较后，此二分的模块度为5/14。</desc><defs><marker id="arr-10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ecaff"/></marker></defs><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 10 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">社团划分：内部边多还不够</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  观察</text><text x="749" y="190" font-size="19" fill="#eff8ff" >两组三角形 + 1 条桥</text><text x="749" y="216" font-size="19" fill="#bdd2df" >m=7，组内边共 6</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  比较基线</text><text x="749" y="295" font-size="19" fill="#eff8ff" >真实内部边比例</text><text x="749" y="321" font-size="19" fill="#bdd2df" >减去度数保持随机预期</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  本例模块度</text><text x="749" y="400" font-size="19" fill="#eff8ff" >两群划分 Q = 5/14</text><text x="749" y="426" font-size="19" fill="#bdd2df" >约 0.357；单群 Q=0</text>
<rect x="59" y="165" width="291" height="240" rx="19" fill="#142b44" stroke="#437a89" stroke-width="2"/><rect x="376" y="165" width="291" height="240" rx="19" fill="#302c41" stroke="#a98263" stroke-width="2"/>
