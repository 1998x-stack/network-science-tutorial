<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-07-title diagram-07-desc"><title id="diagram-07-title">真实八节点七边样本的完整经验度分布</title><desc id="diagram-07-desc">与第七章代码完全一致：度数为0 1 2的节点各有2个，度数为3 5的节点各有1个，总节点8，边数7。次数为2 2 2 1 1，总度数14，度数二阶矩5.5。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><g font-family="system-ui,'PingFang SC',sans-serif">
<text x="40" y="56" font-size="16" fill="#74dfc9" font-weight="720" letter-spacing="2">CH 07 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">八节点度数分布：孤立点也计入分母</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text>
<path d="M 102 386 H 680 M 102 386 V 185" stroke="#8da9ba" stroke-width="2" fill="none"/>
<rect x="129" y="223" width="65" height="154" rx="8" fill="#ff9b90"/><text x="161" y="209" font-size="19" text-anchor="middle" fill="#eff8ff">2 个</text><text x="161" y="415" font-size="20" text-anchor="middle" fill="#bdd2df">k=0</text><rect x="239" y="223" width="65" height="154" rx="8" fill="#74dfc9"/><text x="271" y="209" font-size="19" text-anchor="middle" fill="#eff8ff">2 个</text><text x="271" y="415" font-size="20" text-anchor="middle" fill="#bdd2df">k=1</text><rect x="349" y="223" width="65" height="154" rx="8" fill="#74dfc9"/><text x="381" y="209" font-size="19" text-anchor="middle" fill="#eff8ff">2 个</text><text x="381" y="415" font-size="20" text-anchor="middle" fill="#bdd2df">k=2</text><rect x="459" y="300" width="65" height="77" rx="8" fill="#74dfc9"/><text x="491" y="286" font-size="19" text-anchor="middle" fill="#eff8ff">1 个</text><text x="491" y="415" font-size="20" text-anchor="middle" fill="#bdd2df">k=3</text><rect x="569" y="300" width="65" height="77" rx="8" fill="#ffcc87"/><text x="601" y="286" font-size="19" text-anchor="middle" fill="#eff8ff">1 个</text><text x="601" y="415" font-size="20" text-anchor="middle" fill="#bdd2df">k=5</text>
<text x="402" y="189" font-size="20" text-anchor="middle" fill="#ffcc87">从代码的 8 个节点逐一计数</text>
<text x="749" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  分母</text><text x="749" y="190" font-size="19" fill="#eff8ff">n=8，m=7</text><text x="749" y="216" font-size="19" fill="#bdd2df">含 2 个合法孤立点</text>
<path d="M 748 232 L 1058 232" stroke="#2f5268"/>
<text x="749" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  频数</text><text x="749" y="295" font-size="19" fill="#eff8ff">k=0,1,2：各 2 个</text><text x="749" y="321" font-size="19" fill="#bdd2df">k=3,5：各 1 个</text>
<path d="M 748 337 L 1058 337" stroke="#2f5268"/>
<text x="749" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  算式检查</text><text x="749" y="400" font-size="19" fill="#eff8ff">Σk=14=2m</text><text x="749" y="426" font-size="19" fill="#bdd2df">E[k²]=5.5</text>
<text x="39" y="483" font-size="16" fill="#74dfc9">蓝绿：度数频数</text><text x="257" y="483" font-size="16" fill="#ffcc87">珊瑚色：孤立点不能遗漏</text><text x="755" y="483" font-size="16" fill="#bdd2df">与章节可运行样本一致</text>
</g></svg>
