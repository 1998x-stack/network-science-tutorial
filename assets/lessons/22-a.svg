<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="n22a-title n22a-desc"><title id="n22a-title">三节点路径的 GCN 对称归一化</title><desc id="n22a-desc">A B C 组成路径，加入自环后含自环度数分别为二、三、二。仅 A 的输入特征为一，B 的一次对称归一化聚合得到 1 除以根号六。</desc><rect x="1" y="1" width="918" height="368" rx="22" fill="#10283b" stroke="#34556e"/><g font-family="system-ui,'PingFang SC',sans-serif">
    <g stroke="#7cc9bd" stroke-width="6"><path d="M160 155 H445 H725" fill="none"/></g>
    <circle cx="160" cy="155" r="51" fill="#23687f" stroke="#b2ecda" stroke-width="3"/><text x="160" y="165" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">A</text><text x="160" y="239" text-anchor="middle" font-size="19" fill="#e2edf1">x=1, d̃=2</text><circle cx="445" cy="155" r="51" fill="#a26734" stroke="#b2ecda" stroke-width="3"/><text x="445" y="165" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">B</text><text x="445" y="239" text-anchor="middle" font-size="19" fill="#e2edf1">x=0, d̃=3</text><circle cx="725" cy="155" r="51" fill="#23687f" stroke="#b2ecda" stroke-width="3"/><text x="725" y="165" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">C</text><text x="725" y="239" text-anchor="middle" font-size="19" fill="#e2edf1">x=0, d̃=2</text>
    <path d="M120 120 Q78 52 160 62 Q240 75 203 122" fill="none" stroke="#9cbacd" stroke-width="2.5"/>
    <path d="M405 115 Q370 40 445 54 Q520 50 487 120" fill="none" stroke="#9cbacd" stroke-width="2.5"/>
    <path d="M684 118 Q650 46 727 57 Q798 64 772 125" fill="none" stroke="#9cbacd" stroke-width="2.5"/>
    <text x="445" y="300" text-anchor="middle" fill="#a5ecdb" font-size="23">h_B = 1/√(2×3) ≈ 0.4082</text>
    <text x="445" y="336" text-anchor="middle" fill="#d5e8ef" font-size="15">只展示线性传播；权重矩阵 W=1，未应用激活函数。</text></g></svg>
