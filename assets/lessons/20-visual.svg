<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-20-title diagram-20-desc"><title id="diagram-20-title">静态边相同，时间顺序决定可达性</title><desc id="diagram-20-desc">A-B B-C C-D的静态图相同。接触按1 2 3发生时A0可在3到D；若接触按3 1 2错序，从A无法在合法严格递增路径抵达C D。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 20 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">静态边相同，时间顺序决定可达性</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  拓扑</text><text x="749" y="190" font-size="19" fill="#eff8ff" >两行都是 A—B—C—D</text><text x="749" y="216" font-size="19" fill="#bdd2df" >静态连通完全相同</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  合法事件</text><text x="749" y="295" font-size="19" fill="#eff8ff" >AB@1 → BC@2 → CD@3</text><text x="749" y="321" font-size="19" fill="#bdd2df" >A@0 能在 t=3 抵达 D</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  错序事件</text><text x="749" y="400" font-size="19" fill="#eff8ff" >AB@3、BC@1、CD@2</text><text x="749" y="426" font-size="19" fill="#bdd2df" >A 无法抵达 C、D</text>
<text x="75" y="232" font-size="22" fill="#74dfc9" >顺序</text><path d="M163 225 L292 225" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><text x="227" y="203" font-size="19" fill="#ffcc87" text-anchor="middle">@1</text><path d="M292 225 L421 225" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><text x="356" y="203" font-size="19" fill="#ffcc87" text-anchor="middle">@2</text><path d="M421 225 L550 225" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><text x="485" y="203" font-size="19" fill="#ffcc87" text-anchor="middle">@3</text><circle cx="163" cy="225" r="23" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="163" y="232" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="292" cy="225" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="292" y="232" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="421" cy="225" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="421" y="232" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="550" cy="225" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="550" y="232" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">D</text><text x="75" y="365" font-size="22" fill="#ff9b90" >错序</text><path d="M163 358 L292 358" stroke="#ff9b90" stroke-width="5" fill="none" stroke-linecap="round" /><text x="227" y="336" font-size="19" fill="#ff9b90" text-anchor="middle">@3</text><path d="M292 358 L421 358" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><text x="356" y="336" font-size="19" fill="#ffcc87" text-anchor="middle">@1</text><path d="M421 358 L550 358" stroke="#8ecaff" stroke-width="5" fill="none" stroke-linecap="round" /><text x="485" y="336" font-size="19" fill="#ffcc87" text-anchor="middle">@2</text><circle cx="163" cy="358" r="23" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="163" y="365" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">A</text><circle cx="292" cy="358" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="292" y="365" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">B</text><circle cx="421" cy="358" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="421" y="365" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">C</text><circle cx="550" cy="358" r="23" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="550" y="365" font-size="21" fill="#0b1828" text-anchor="middle" font-weight="740">D</text>
<text x="350" y="431" font-size="19" fill="#bdd2df" text-anchor="middle">从 A@0 出发：上可达，下不可达</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：历史/可见状态</text><text x="275" y="483" font-size="16" fill="#ffcc87" >琥珀：关键边界或变化</text><text x="755" y="483" font-size="16" fill="#bdd2df" >示意值不代表真实预测</text></svg>
