<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">由原始事件清洗到无向网络</title><desc id="desc">左面六条有向事件中A-B与B-A在无向投影中合并，C-C自环被排除；右面剩余五节点四边路径A-B-C-D-E。</desc><rect width="760" height="340" rx="18" fill="#102238"/><rect x="25" y="32" width="235" height="280" rx="12" fill="#152f45"/><text x="142" y="56" text-anchor="middle" font-size="16" fill="#e9f4ff">原始事件（6 行）</text><text x="48" y="90" fill="#d4eaff" font-size="15">A→B · t1</text><text x="48" y="124" fill="#f4bc7c" font-size="15">B→A · t2 · 无向合并</text><text x="48" y="158" fill="#d4eaff" font-size="15">B→C · t3</text><text x="48" y="192" fill="#f4bc7c" font-size="15">C→C · t4 · 自环排除</text><text x="48" y="226" fill="#d4eaff" font-size="15">C→D · t5</text><text x="48" y="260" fill="#d4eaff" font-size="15">D→E · t6</text><path d="M270 166 L312 166" stroke="#f4bc7c" stroke-width="4" fill="none"/><path d="M301 157 L314 166 L301 175" stroke="#f4bc7c" stroke-width="4" fill="none"/><line x1="350" y1="45" x2="430" y2="100" stroke="#70dbc3" stroke-width="4"/><line x1="430" y1="100" x2="510" y2="155" stroke="#70dbc3" stroke-width="4"/><line x1="510" y1="155" x2="590" y2="210" stroke="#70dbc3" stroke-width="4"/><line x1="590" y1="210" x2="670" y2="265" stroke="#70dbc3" stroke-width="4"/><circle cx="350" cy="45" r="23" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="350" y="51" text-anchor="middle" font-size="17" fill="#102135" font-weight="800">A</text><circle cx="430" cy="100" r="23" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="430" y="106" text-anchor="middle" font-size="17" fill="#102135" font-weight="800">B</text><circle cx="510" cy="155" r="23" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="510" y="161" text-anchor="middle" font-size="17" fill="#102135" font-weight="800">C</text><circle cx="590" cy="210" r="23" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="590" y="216" text-anchor="middle" font-size="17" fill="#102135" font-weight="800">D</text><circle cx="670" cy="265" r="23" fill="#85b5ff" stroke="#fff" stroke-width="2"/><text x="670" y="271" text-anchor="middle" font-size="17" fill="#102135" font-weight="800">E</text><text x="550" y="315" text-anchor="middle" font-size="14" fill="#d3e6f4">投影：5 节点、4 边 · 方向/事件次数不再保留</text></svg>
