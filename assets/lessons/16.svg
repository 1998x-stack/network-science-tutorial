<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">用于链路预测的训练图与待预测连接</title><desc id="desc">训练图的已观察边为AB、AC、BC、BD、CD、DE，未观测的AD用橙色虚线表示。A和D的共同邻居是B、C。</desc><rect width="760" height="340" rx="18" fill="#102238"/><line x1="120" y1="165" x2="285" y2="75" stroke="#70dbc3" stroke-width="4"/><line x1="120" y1="165" x2="285" y2="255" stroke="#70dbc3" stroke-width="4"/><line x1="285" y1="75" x2="285" y2="255" stroke="#70dbc3" stroke-width="4"/><line x1="285" y1="75" x2="488" y2="165" stroke="#70dbc3" stroke-width="4"/><line x1="285" y1="255" x2="488" y2="165" stroke="#70dbc3" stroke-width="4"/><line x1="488" y1="165" x2="645" y2="165" stroke="#70dbc3" stroke-width="4"/><line x1="153" y1="165" x2="455" y2="165" stroke="#f4bc7c" stroke-width="4" stroke-dasharray="9 8"/><text x="375" y="154" text-anchor="middle" font-size="15" fill="#f4bc7c">候选 A–D（未观察）</text><circle cx="120" cy="165" r="27" fill="#f4bc7c" stroke="#f2f8ff" stroke-width="2"/><text x="120" y="171" fill="#132335" font-size="19" font-weight="800" text-anchor="middle">A</text><circle cx="285" cy="75" r="27" fill="#85b5ff" stroke="#f2f8ff" stroke-width="2"/><text x="285" y="81" fill="#132335" font-size="19" font-weight="800" text-anchor="middle">B</text><circle cx="285" cy="255" r="27" fill="#85b5ff" stroke="#f2f8ff" stroke-width="2"/><text x="285" y="261" fill="#132335" font-size="19" font-weight="800" text-anchor="middle">C</text><circle cx="488" cy="165" r="27" fill="#f4bc7c" stroke="#f2f8ff" stroke-width="2"/><text x="488" y="171" fill="#132335" font-size="19" font-weight="800" text-anchor="middle">D</text><circle cx="645" cy="165" r="27" fill="#f4bc7c" stroke="#f2f8ff" stroke-width="2"/><text x="645" y="171" fill="#132335" font-size="19" font-weight="800" text-anchor="middle">E</text><text x="380" y="320" text-anchor="middle" font-size="14" fill="#d0e0ed">实线 E₀=6 条 · 蓝色 B、C 为共同邻居 · 虚线不参与任何训练图分数</text></svg>
