<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-21-title diagram-21-desc"><title id="diagram-21-title">node2vec：p / q 改变二阶游走倾向</title><desc id="diagram-21-desc">一份三候选的玩具分数分别为返回1/p、相邻1、外扩1/q，当p等于1 q等于2时权重1 1 0.5，总量2.5，归一化后概率0.4 0.4 0.2。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 21 / VISUAL REASONING</text><text x="39" y="92" font-size="29" fill="#eff8ff" font-weight="760">node2vec：p / q 改变二阶游走倾向</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  条件采样</text><text x="749" y="190" font-size="19" fill="#eff8ff" >前一节点 t 与当前 v 已知</text><text x="749" y="216" font-size="19" fill="#bdd2df" >候选 x 按距离重加权</text><path d="M748 232 L1058 232" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  玩具参数</text><text x="749" y="295" font-size="19" fill="#eff8ff" >p=1，q=2</text><text x="749" y="321" font-size="19" fill="#bdd2df" >权重：1、1、1/2</text><path d="M748 337 L1058 337" stroke="#2f5268" stroke-width="1" fill="none" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  概率守恒</text><text x="749" y="400" font-size="19" fill="#eff8ff" >返回 0.4；相邻 0.4</text><text x="749" y="426" font-size="19" fill="#bdd2df" >外扩 0.2；总和 1</text>
<text x="80" y="190" font-size="22" fill="#bdd2df" >三种候选类型</text>
<text x="93" y="246" font-size="22" fill="#74dfc9" >返回</text><rect x="205" y="219" width="380" height="37" rx="8" fill="#74dfc9"/><text x="610" y="246" font-size="23" fill="#eff8ff" text-anchor="middle">0.4</text><text x="93" y="330" font-size="22" fill="#8ecaff" >相邻</text><rect x="205" y="303" width="380" height="37" rx="8" fill="#8ecaff"/><text x="610" y="330" font-size="23" fill="#eff8ff" text-anchor="middle">0.4</text><text x="93" y="414" font-size="22" fill="#ffcc87" >外扩</text><rect x="205" y="387" width="190" height="37" rx="8" fill="#ffcc87"/><text x="610" y="414" font-size="23" fill="#eff8ff" text-anchor="middle">0.2</text>
<text x="361" y="438" font-size="17" fill="#bdd2df" text-anchor="middle">数学比例示意，未训练向量</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：历史/可见状态</text><text x="275" y="483" font-size="16" fill="#ffcc87" >琥珀：关键边界或变化</text><text x="755" y="483" font-size="16" fill="#bdd2df" >示意值不代表真实预测</text></svg>
