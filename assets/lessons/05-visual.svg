<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-05-title diagram-05-desc"><title id="diagram-05-title">少量重连：边数不变，但捷径出现</title><desc id="diagram-05-desc">六节点环只有六条边，演示删除0到1边并以0到3边取代，边数仍为六。该环的k为2，仅用于说明重连步骤，不是声称完整复现Watts-Strogatz的k4实验。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 05 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">少量重连：边数不变，但捷径出现</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  起点</text><text x="749" y="190" font-size="19" fill="#eff8ff" >六节点规则环：m=6</text><text x="749" y="216" font-size="19" fill="#bdd2df" >从 0 到 3 最短路长 3</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  一条重连</text><text x="749" y="295" font-size="19" fill="#eff8ff" >删 0—1，加入 0—3</text><text x="749" y="321" font-size="19" fill="#bdd2df" >边数始终是 6</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  结果</text><text x="749" y="400" font-size="19" fill="#eff8ff" >新的 0—3 最短路长 1</text><text x="749" y="426" font-size="19" fill="#bdd2df" >不等于真实 WS 统计实验</text>
<path d="M 193 189 L 280.4685657822283 239.5" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 280.4685657822283 239.5 L 280.4685657822283 340.5" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 280.4685657822283 340.5 L 193 391" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 193 391 L 105.53143421777172 340.50000000000006" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 105.53143421777172 340.50000000000006 L 105.5314342177717 239.5" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 105.5314342177717 239.5 L 193 189" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><circle cx="193" cy="189" r="21" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="193" y="196" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">0</text><circle cx="280.4685657822283" cy="239.5" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="280.4685657822283" y="246.5" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">1</text><circle cx="280.4685657822283" cy="340.5" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="280.4685657822283" y="347.5" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">2</text><circle cx="193" cy="391" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="193" y="398" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">3</text><circle cx="105.53143421777172" cy="340.50000000000006" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="105.53143421777172" y="347.50000000000006" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">4</text><circle cx="105.5314342177717" cy="239.5" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="105.5314342177717" y="246.5" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">5</text><path d="M 610.4685657822283 239.5 L 610.4685657822283 340.5" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 610.4685657822283 340.5 L 523 391" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 523 391 L 435.53143421777173 340.50000000000006" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 435.53143421777173 340.50000000000006 L 435.5314342177717 239.5" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 435.5314342177717 239.5 L 523 189" fill="none" stroke="#8ecaff" stroke-width="4" stroke-linecap="round" /><path d="M 523 189 L 523 391" fill="none" stroke="#ffcc87" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 6"/><circle cx="523" cy="189" r="21" fill="#ffcc87" stroke="#0c2733" stroke-width="3"/><text x="523" y="196" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">0</text><circle cx="610.4685657822283" cy="239.5" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="610.4685657822283" y="246.5" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">1</text><circle cx="610.4685657822283" cy="340.5" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="610.4685657822283" y="347.5" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">2</text><circle cx="523" cy="391" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="523" y="398" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">3</text><circle cx="435.53143421777173" cy="340.50000000000006" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="435.53143421777173" y="347.50000000000006" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">4</text><circle cx="435.5314342177717" cy="239.5" r="21" fill="#74dfc9" stroke="#0c2733" stroke-width="3"/><text x="435.5314342177717" y="246.5" font-size="23" fill="#0b1828" text-anchor="middle" font-weight="750">5</text>
<text x="193" y="414" font-size="20" fill="#bdd2df" text-anchor="middle">原始 6 环</text><text x="523" y="414" font-size="19" fill="#ffcc87" text-anchor="middle">移除 0—1，增加 0—3</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观察结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >数值均为教学算例</text></svg>
