<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">小世界网络从规则到随机</title><desc id="desc">规则环形网络、加入少量远程捷径的小世界网络、随机化网络的结构对比。</desc><rect width="760" height="330" rx="18" fill="#102238"/><g stroke="#70dbc3" stroke-width="2.5" fill="none"><path d="M95 100 L145 55 L195 100 L195 165 L145 210 L95 165 Z M95 100 L195 100 M145 55 L195 165 M95 165 L145 210 M95 100 L95 165 M145 55 L145 210"/><path d="M330 100 L380 55 L430 100 L430 165 L380 210 L330 165 Z M330 100 L430 100 M380 55 L430 165 M330 165 L380 210 M330 100 L330 165 M380 55 L380 210"/><path d="M330 100 L430 165" stroke="#f4bc7c" stroke-width="5"/><path d="M565 100 L615 55 L665 100 L665 165 L615 210 L565 165 Z M565 100 L665 100 M615 55 L665 165 M565 165 L615 210 M565 100 L565 165 M615 55 L615 210 M565 100 L615 210 M665 100 L615 210 M565 165 L665 100 M615 55 L565 165"/></g><g fill="#f4bc7c" stroke="#fff" stroke-width="2"><circle cx="95" cy="100" r="8"/><circle cx="145" cy="55" r="8"/><circle cx="195" cy="100" r="8"/><circle cx="195" cy="165" r="8"/><circle cx="145" cy="210" r="8"/><circle cx="95" cy="165" r="8"/><circle cx="330" cy="100" r="8"/><circle cx="380" cy="55" r="8"/><circle cx="430" cy="100" r="8"/><circle cx="430" cy="165" r="8"/><circle cx="380" cy="210" r="8"/><circle cx="330" cy="165" r="8"/><circle cx="565" cy="100" r="8"/><circle cx="615" cy="55" r="8"/><circle cx="665" cy="100" r="8"/><circle cx="665" cy="165" r="8"/><circle cx="615" cy="210" r="8"/><circle cx="565" cy="165" r="8"/></g><g fill="#eaf3ff" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle"><text x="145" y="265">规则环 · β=0</text><text x="380" y="265">少量捷径 · β 较小</text><text x="615" y="265">高度重连 · β 接近 1</text></g><text x="380" y="302" fill="#9fb4ce" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">橙色边表示跨越局部邻域的捷径</text></svg>
