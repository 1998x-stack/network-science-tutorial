<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="diagram-04-title diagram-04-desc"><title id="diagram-04-title">ER 随机连边：期望不是确定边数</title><desc id="diagram-04-desc">n等于5时共有十个无向不同节点对，p等于0.2意味着每对独立以20%概率连边，期望边数2，但具体样本不会恒为两条边。</desc><rect width="1100" height="510" rx="24" fill="#0b1828"/><rect x="16" y="16" width="1068" height="476" rx="18" fill="#10283a" stroke="#2f5268" stroke-width="2"/><rect x="29" y="110" width="692" height="351" rx="18" fill="#0e2435" stroke="#3d6680" stroke-width="2"/><rect x="735" y="110" width="338" height="351" rx="18" fill="#122b3e" stroke="#33566c" stroke-width="2"/><text x="40" y="56" font-size="16" fill="#74dfc9" letter-spacing="2" font-weight="720">CH 04 / VISUAL REASONING</text><text x="39" y="92" font-size="30" fill="#eff8ff" font-weight="760">ER 随机连边：期望不是确定边数</text><text x="49" y="143" font-size="17" fill="#8da9ba" font-weight="700">机制观察区</text><text x="750" y="161" font-size="18" fill="#74dfc9" font-weight="720">01  试验空间</text><text x="749" y="190" font-size="19" fill="#eff8ff" >5 节点有 10 个候选节点对</text><text x="749" y="216" font-size="19" fill="#bdd2df" >组合数 C(5,2)=10</text><path d="M 748 232 L 1058 232" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="266" font-size="18" fill="#74dfc9" font-weight="720">02  独立随机</text><text x="749" y="295" font-size="19" fill="#eff8ff" >每对以 p=0.2 连边</text><text x="749" y="321" font-size="19" fill="#bdd2df" >不是固定抽取 2 条</text><path d="M 748 337 L 1058 337" fill="none" stroke="#2f5268" stroke-width="1" stroke-linecap="round" /><text x="750" y="371" font-size="18" fill="#74dfc9" font-weight="720">03  期望值</text><text x="749" y="400" font-size="19" fill="#eff8ff" >E[m]=10×0.2=2</text><text x="749" y="426" font-size="19" fill="#bdd2df" >实际抽样可为 0…10 边</text>
<rect x="89" y="204" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="137" y="245" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="207" y="204" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="255" y="245" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="325" y="204" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="373" y="245" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="443" y="204" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="491" y="245" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="561" y="204" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="609" y="245" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="89" y="287" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="137" y="328" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="207" y="287" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="255" y="328" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="325" y="287" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="373" y="328" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="443" y="287" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="491" y="328" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text><rect x="561" y="287" width="96" height="64" rx="10" fill="#173c4f" stroke="#44687b" stroke-width="2"/><text x="609" y="328" font-size="19" fill="#8ecaff" text-anchor="middle">P=0.2</text>
<text x="375" y="397" font-size="22" fill="#ffcc87" text-anchor="middle">10 次 Bernoulli 连边试验</text><text x="39" y="483" font-size="16" fill="#74dfc9" >蓝绿：可观察结构</text><text x="257" y="483" font-size="16" fill="#ffcc87" >琥珀：关键变化或待核对项</text><text x="755" y="483" font-size="16" fill="#bdd2df" >数值均为教学算例</text></svg>
