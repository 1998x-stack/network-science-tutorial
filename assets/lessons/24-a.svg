<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="n24a-title n24a-desc"><title id="n24a-title">Karate Club 真实规模与合成分区边界</title><desc id="n24a-desc">左侧历史数据的节点数三十四边数七十八，右侧仅四节点合成例子展示阵营标签与算法编号可能交换，绝非真实原始边表。</desc><rect x="1" y="1" width="918" height="368" rx="22" fill="#10283b" stroke="#34556e"/><g font-family="system-ui,'PingFang SC',sans-serif">
 <rect x="23" y="44" width="408" height="258" rx="20" fill="#173b55" stroke="#70b6b3"/><text x="227" y="94" text-anchor="middle" fill="#9af2dc" font-size="23">Zachary's Karate Club</text><text x="227" y="164" text-anchor="middle" fill="#fff" font-size="48" font-weight="700">34 / 78</text><text x="227" y="202" text-anchor="middle" fill="#d3e5ed" font-size="19">节点 / 无向边</text><text x="227" y="252" text-anchor="middle" fill="#f0c790" font-size="17">历史观察网络，不是此图复画</text>
 <rect x="466" y="44" width="430" height="258" rx="20" fill="#173b55" stroke="#70b6b3"/><text x="680" y="91" text-anchor="middle" fill="#9af2dc" font-size="22">合成四节点分区</text>
 <circle cx="535" cy="165" r="33" fill="#277e7e" stroke="#bcebe3" stroke-width="2"/><text x="535" y="173" font-size="24" text-anchor="middle" fill="#fff">A</text><circle cx="630" cy="165" r="33" fill="#277e7e" stroke="#bcebe3" stroke-width="2"/><text x="630" y="173" font-size="24" text-anchor="middle" fill="#fff">A</text><circle cx="730" cy="165" r="33" fill="#a86936" stroke="#bcebe3" stroke-width="2"/><text x="730" y="173" font-size="24" text-anchor="middle" fill="#fff">B</text><circle cx="825" cy="165" r="33" fill="#a86936" stroke="#bcebe3" stroke-width="2"/><text x="825" y="173" font-size="24" text-anchor="middle" fill="#fff">B</text>
 <text x="681" y="257" text-anchor="middle" fill="#d3e5ed" font-size="17">交换 A/B 编号不改变分区结构</text><text x="461" y="346" text-anchor="middle" fill="#aacedd" font-size="14">左侧为有来源的规模数据；右侧明确为合成示意，不可混作数据集原图。</text></g></svg>
