<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">四节点网络的基本度量</title><desc id="desc">三角形节点0、1、2连接叶节点3，标注各节点度数和结构统计量。</desc><rect width="760" height="330" rx="18" fill="#102238"/><g stroke="#70dbc3" stroke-width="5" fill="none"><path d="M140 115 L310 115 L225 250 Z M310 115 L475 250"/></g><g fill="#f4bc7c" stroke="#fff" stroke-width="3"><circle cx="140" cy="115" r="27"/><circle cx="310" cy="115" r="27"/><circle cx="225" cy="250" r="27"/><circle cx="475" cy="250" r="27"/></g><g fill="#102238" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="140" y="121">0</text><text x="310" y="121">1</text><text x="225" y="256">2</text><text x="475" y="256">3</text></g><g fill="#eaf3ff" font-family="system-ui,sans-serif" font-size="16"><text x="105" y="66">度 2</text><text x="325" y="66">度 2</text><text x="185" y="302">度 3</text><text x="500" y="302">度 1</text><text x="545" y="100" font-weight="700">n = 4, m = 4</text><text x="545" y="135">密度 = 2/3</text><text x="545" y="170">平均聚集 = 7/12</text><text x="545" y="205">传递性 = 3/5</text><text x="545" y="240">平均路径 = 4/3</text></g></svg>
