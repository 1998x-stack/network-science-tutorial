<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">哥尼斯堡七桥图</title><desc id="desc">四个顶点表示两岸和两座岛屿，七条边表示七座桥，顶点度数为三、三、五、三。</desc><rect width="760" height="320" rx="18" fill="#102238"/><g stroke="#70dbc3" stroke-width="4" fill="none" stroke-linecap="round"><path d="M180 70 L300 225 M192 58 L312 213 M580 70 L320 225 M568 58 L308 213 M300 225 L500 225 M180 70 L500 225 M580 70 L500 225"/></g><g fill="#f4bc7c" stroke="#fff" stroke-width="3"><circle cx="180" cy="70" r="23"/><circle cx="580" cy="70" r="23"/><circle cx="300" cy="225" r="23"/><circle cx="500" cy="225" r="23"/></g><g fill="#eaf3ff" font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="180" y="35">北岸 · 度 3</text><text x="580" y="35">南岸 · 度 3</text><text x="300" y="275">岛 A · 度 5</text><text x="500" y="275">岛 B · 度 3</text></g><text x="380" y="305" fill="#9fb4ce" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">所有四个顶点都是奇度顶点，因此不存在欧拉路径</text></svg>
