<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 450" role="img" aria-labelledby="road-title road-desc"><title id="road-title">28 章网络科学完整学习路径</title><desc id="road-desc">六个连贯学习阶段：01-03图论基础，04-07网络生成与异质性，08-11中心性和社团，12-16传播与预测，17-23数据、时间与图学习，24-28公开案例和可复现研究。阶段关系按阅读顺序排列。</desc><rect width="1250" height="450" rx="20" fill="#0b1d2f"/><g font-family="system-ui,'PingFang SC',sans-serif">
<text x="42" y="44" fill="#7ce6d0" font-size="18" font-weight="750">FOUNDATIONS → MECHANISMS → EVIDENCE</text>
<text x="43" y="81" fill="#edf9ff" font-size="29" font-weight="750">从图的语言，走向可复核的网络科学研究</text>
<rect x="40" y="122" width="385" height="129" rx="16" fill="#173449" stroke="#3c6b7c" stroke-width="2"/><rect x="54" y="139" width="76" height="32" rx="9" fill="#245d65"/><text x="92" y="162" text-anchor="middle" fill="#f9fffe" font-size="19" font-weight="700">01–03</text><text x="148" y="165" fill="#eff8ff" font-size="23" font-weight="680">图论与网络度量</text><text x="65" y="208" fill="#b7d6df" font-size="19">先定义节点、边和分母</text><rect x="449" y="122" width="385" height="129" rx="16" fill="#173449" stroke="#3c6b7c" stroke-width="2"/><rect x="463" y="139" width="76" height="32" rx="9" fill="#4f4946"/><text x="501" y="162" text-anchor="middle" fill="#f9fffe" font-size="19" font-weight="700">04–07</text><text x="557" y="165" fill="#eff8ff" font-size="23" font-weight="680">生成模型与异质性</text><text x="474" y="208" fill="#b7d6df" font-size="19">解释网络为何长成这样</text><rect x="858" y="122" width="385" height="129" rx="16" fill="#173449" stroke="#3c6b7c" stroke-width="2"/><rect x="872" y="139" width="76" height="32" rx="9" fill="#245d65"/><text x="910" y="162" text-anchor="middle" fill="#f9fffe" font-size="19" font-weight="700">08–11</text><text x="966" y="165" fill="#eff8ff" font-size="23" font-weight="680">中心性与群体结构</text><text x="883" y="208" fill="#b7d6df" font-size="19">拆解“重要”的不同含义</text><rect x="40" y="276" width="385" height="129" rx="16" fill="#173449" stroke="#3c6b7c" stroke-width="2"/><rect x="54" y="293" width="76" height="32" rx="9" fill="#4f4946"/><text x="92" y="316" text-anchor="middle" fill="#f9fffe" font-size="19" font-weight="700">12–16</text><text x="148" y="319" fill="#eff8ff" font-size="23" font-weight="680">传播、博弈与预测</text><text x="65" y="362" fill="#b7d6df" font-size="19">把过程放到图结构上</text><rect x="449" y="276" width="385" height="129" rx="16" fill="#173449" stroke="#3c6b7c" stroke-width="2"/><rect x="463" y="293" width="76" height="32" rx="9" fill="#245d65"/><text x="501" y="316" text-anchor="middle" fill="#f9fffe" font-size="19" font-weight="700">17–23</text><text x="557" y="319" fill="#eff8ff" font-size="23" font-weight="680">数据、时间与图学习</text><text x="474" y="362" fill="#b7d6df" font-size="19">严格管理观察与模型输入</text><rect x="858" y="276" width="385" height="129" rx="16" fill="#235355" stroke="#83e5c9" stroke-width="2"/><rect x="872" y="293" width="76" height="32" rx="9" fill="#4f4946"/><text x="910" y="316" text-anchor="middle" fill="#f9fffe" font-size="19" font-weight="700">24–28</text><text x="966" y="319" fill="#eff8ff" font-size="23" font-weight="680">公开实例与研究报告</text><text x="883" y="362" fill="#b7d6df" font-size="19">独立实验验证且明确局限</text>
<text x="621" y="426" fill="#bed4e3" font-size="17" text-anchor="middle">每一阶段都能追溯：概念 → 结构 → 算法 → 证据 → 局限</text>
</g></svg>
