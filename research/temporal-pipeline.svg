<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="f-time-title f-time-desc"><title id="f-time-title">训练验证测试时间边界</title><desc id="f-time-desc">t一到二为训练边AB AC BC CD；t三为验证边DE；t五为未来测试边BD，测试边不得反馈训练。</desc><rect x="1" y="1" width="998" height="408" rx="24" fill="#10283b" stroke="#51748b"/><g font-family="system-ui,'PingFang SC',sans-serif">
<text x="42" y="56" fill="#a5e9d9" font-size="26">时间外链路预测 · 清晰的三段切分</text>
<path d="M85 202 H924" fill="none" stroke="#a8c9d7" stroke-width="5"/>
<g fill="#e7f7f8" font-size="20" text-anchor="middle"><text x="165" y="175">t = 1</text><text x="369" y="175">t = 2</text><text x="605" y="175">t = 3</text><text x="844" y="175">t = 5</text></g>
<path d="M165 190 v24" stroke="#cde5ee" stroke-width="4"/><path d="M369 190 v24" stroke="#cde5ee" stroke-width="4"/><path d="M605 190 v24" stroke="#cde5ee" stroke-width="4"/><path d="M844 190 v24" stroke="#cde5ee" stroke-width="4"/>
<rect x="73" y="242" width="184" height="91" rx="15" fill="#205b67" stroke="#93d1c6"/><text x="165" y="276" fill="white" font-size="22" text-anchor="middle">AB、AC</text><text x="165" y="306" fill="#e4f1f2" font-size="17" text-anchor="middle">训练</text><rect x="277" y="242" width="184" height="91" rx="15" fill="#205b67" stroke="#93d1c6"/><text x="369" y="276" fill="white" font-size="22" text-anchor="middle">BC、CD</text><text x="369" y="306" fill="#e4f1f2" font-size="17" text-anchor="middle">训练</text><rect x="513" y="242" width="184" height="91" rx="15" fill="#8b6f43" stroke="#93d1c6"/><text x="605" y="276" fill="white" font-size="22" text-anchor="middle">DE</text><text x="605" y="306" fill="#e4f1f2" font-size="17" text-anchor="middle">验证</text><rect x="752" y="242" width="184" height="91" rx="15" fill="#985649" stroke="#93d1c6"/><text x="844" y="276" fill="white" font-size="22" text-anchor="middle">BD</text><text x="844" y="306" fill="#e4f1f2" font-size="17" text-anchor="middle">测试：未来</text>
<text x="500" y="376" text-anchor="middle" fill="#c5dde9" font-size="17">训练截止 t≤2；模型选型可用 t=3 验证；t=5 的 BD 只能作测试标签。</text></g></svg>
